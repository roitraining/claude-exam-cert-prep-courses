<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Sensitive Data Sanitization Workflow">
  <rect width="1200" height="320" rx="16" fill="#f8fafc"/>
  <rect x="35" y="45" width="330" height="230" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="200" y="85" text-anchor="middle" fill="#7f1d1d" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700">Raw Source File (Do Not Upload)</text>
  <text x="200" y="130" text-anchor="middle" fill="#7f1d1d" font-family="Inter, system-ui, sans-serif" font-size="16">Customer full names</text>
  <text x="200" y="158" text-anchor="middle" fill="#7f1d1d" font-family="Inter, system-ui, sans-serif" font-size="16">Account and SSN numbers</text>
  <text x="200" y="186" text-anchor="middle" fill="#7f1d1d" font-family="Inter, system-ui, sans-serif" font-size="16">Regulated personal data</text>

  <path d="M375 160 H425" stroke="#4e5ce4" stroke-width="4" fill="none"/>
  <polygon points="425,152 440,160 425,168" fill="#4e5ce4"/>

  <rect x="445" y="45" width="310" height="230" rx="14" fill="#e6e4ff" stroke="#4e5ce4" stroke-width="2.5"/>
  <text x="600" y="85" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700">Sanitize Before Upload</text>
  <text x="600" y="130" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="16">Remove PII columns</text>
  <text x="600" y="158" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="16">Replace with Case_001 IDs</text>
  <text x="600" y="186" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="16">Follow organizational policy</text>

  <path d="M765 160 H815" stroke="#16a34a" stroke-width="4" fill="none"/>
  <polygon points="815,152 830,160 815,168" fill="#16a34a"/>

  <rect x="835" y="45" width="330" height="230" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="1000" y="85" text-anchor="middle" fill="#14532d" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700">Safe Trend Analysis in Claude</text>
  <text x="1000" y="130" text-anchor="middle" fill="#14532d" font-family="Inter, system-ui, sans-serif" font-size="16">Analyze anonymized records</text>
  <text x="1000" y="158" text-anchor="middle" fill="#14532d" font-family="Inter, system-ui, sans-serif" font-size="16">Extract operational insights</text>
  <text x="1000" y="186" text-anchor="middle" fill="#14532d" font-family="Inter, system-ui, sans-serif" font-size="16">Zero regulated data exposure</text>
</svg>
