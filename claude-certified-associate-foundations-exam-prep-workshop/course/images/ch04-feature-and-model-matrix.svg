<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Claude Feature and Model Selection Matrix">
  <rect width="1200" height="320" rx="16" fill="#f8fafc"/>
  <!-- Haiku -->
  <rect x="35" y="40" width="350" height="240" rx="14" fill="#e0ecff" stroke="#1e71d6" stroke-width="2.5"/>
  <text x="210" y="82" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700">Claude Haiku</text>
  <text x="210" y="114" text-anchor="middle" fill="#1e71d6" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700">Fastest Speed · Lowest Cost</text>
  <text x="210" y="156" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="16">High-volume short reply drafts</text>
  <text x="210" y="184" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="16">Quick ticket tagging and sorting</text>
  <text x="210" y="212" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="16">Routine formatting tasks</text>

  <!-- Sonnet -->
  <rect x="425" y="40" width="350" height="240" rx="14" fill="#e6e4ff" stroke="#4e5ce4" stroke-width="2.5"/>
  <text x="600" y="82" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700">Claude Sonnet</text>
  <text x="600" y="114" text-anchor="middle" fill="#4e5ce4" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700">Balanced Quality and Speed</text>
  <text x="600" y="156" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="16">Everyday business writing and reports</text>
  <text x="600" y="184" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="16">Claude Projects and Artifacts</text>
  <text x="600" y="212" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="16">Standard analysis and planning</text>

  <!-- Opus -->
  <rect x="815" y="40" width="350" height="240" rx="14" fill="#fae2f8" stroke="#bd35c2" stroke-width="2.5"/>
  <text x="990" y="82" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700">Claude Opus</text>
  <text x="990" y="114" text-anchor="middle" fill="#bd35c2" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700">Deepest Reasoning and Synthesis</text>
  <text x="990" y="156" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="16">Complex multi-source strategy</text>
  <text x="990" y="184" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="16">Nuanced policy reconciliation</text>
  <text x="990" y="212" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="16">High-complexity research</text>
