<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Output Evaluation and Validation Checklist">
  <rect width="1200" height="320" rx="16" fill="#f8fafc"/>
  <rect x="30" y="45" width="265" height="230" rx="14" fill="#ffffff" stroke="#1e71d6" stroke-width="2.5"/>
  <rect x="30" y="45" width="265" height="48" rx="14" fill="#1e71d6"/>
  <text x="162" y="76" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">1. Source Grounding</text>
  <text x="162" y="130" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="16">Check cited subsections,</text>
  <text x="162" y="156" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="16">quotes, and dates against</text>
  <text x="162" y="182" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="16">the authoritative text</text>
  <text x="162" y="230" text-anchor="middle" fill="#1e71d6" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">Never trust model confidence</text>

  <rect x="320" y="45" width="265" height="230" rx="14" fill="#ffffff" stroke="#4e5ce4" stroke-width="2.5"/>
  <rect x="320" y="45" width="265" height="48" rx="14" fill="#4e5ce4"/>
  <text x="452" y="76" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">2. Consistency and Math</text>
  <text x="452" y="130" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="16">Verify table totals match</text>
  <text x="452" y="156" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="16">narrative prose and all</text>
  <text x="452" y="182" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="16">prompt items are complete</text>
  <text x="452" y="230" text-anchor="middle" fill="#4e5ce4" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">Catch internal contradictions</text>

  <rect x="610" y="45" width="265" height="230" rx="14" fill="#ffffff" stroke="#7c47d9" stroke-width="2.5"/>
  <rect x="610" y="45" width="265" height="48" rx="14" fill="#7c47d9"/>
  <text x="742" y="76" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">3. Bias and Audience Fit</text>
  <text x="742" y="130" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="16">Audit for one-sided framing</text>
  <text x="742" y="156" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="16">and tailor tone/detail to</text>
  <text x="742" y="182" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="16">the target reader</text>
  <text x="742" y="230" text-anchor="middle" fill="#7c47d9" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">Select Artifact, table, or inline</text>

  <rect x="900" y="45" width="270" height="230" rx="14" fill="#ffffff" stroke="#bd35c2" stroke-width="2.5"/>
  <rect x="900" y="45" width="270" height="48" rx="14" fill="#bd35c2"/>
  <text x="1035" y="76" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">4. Human Sign-Off</text>
  <text x="1035" y="130" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="16">Route legal, compliance,</text>
  <text x="1035" y="156" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="16">financial, and HR outputs</text>
  <text x="1035" y="182" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="16">to domain experts</text>
  <text x="1035" y="230" text-anchor="middle" fill="#bd35c2" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">Humans own final accountability</text>
</svg>
