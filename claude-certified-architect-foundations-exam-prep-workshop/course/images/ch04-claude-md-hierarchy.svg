<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="1200" height="350" role="img" aria-label="CLAUDE.md and .claude/rules/ Configuration Hierarchy">
  <!-- Box 1: User-Level -->
  <rect x="20" y="20" width="270" height="310" rx="16" fill="#ffffff" stroke="#64748b" stroke-width="2.5"/>
  <rect x="20" y="20" width="270" height="50" rx="16" fill="#475569"/>
  <text x="155" y="52" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="700">1. User Scope</text>
  <text x="155" y="102" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700">~/.claude/CLAUDE.md</text>
  <text x="155" y="144" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="15">Personal preferences</text>
  <text x="155" y="170" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="15">across all projects</text>
  <rect x="40" y="212" width="230" height="90" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="155" y="246" text-anchor="middle" fill="#991b1b" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">Not in Git!</text>
  <text x="155" y="274" text-anchor="middle" fill="#991b1b" font-family="Inter, system-ui, sans-serif" font-size="14">Teammates will not receive</text>

  <!-- Box 2: Project-Level -->
  <rect x="315" y="20" width="275" height="310" rx="16" fill="#ffffff" stroke="#1e71d6" stroke-width="3"/>
  <rect x="315" y="20" width="275" height="50" rx="16" fill="#1e71d6"/>
  <text x="452" y="52" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="700">2. Project Scope</text>
  <text x="452" y="102" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">CLAUDE.md / .claude/CLAUDE.md</text>
  <text x="452" y="144" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="15">Universal team standards,</text>
  <text x="452" y="170" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="15">CI rules, and @import links</text>
  <rect x="335" y="212" width="235" height="90" rx="10" fill="#ecfdf5" stroke="#86efac"/>
  <text x="452" y="246" text-anchor="middle" fill="#065f46" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">Shared via Git</text>
  <text x="452" y="274" text-anchor="middle" fill="#047857" font-family="Inter, system-ui, sans-serif" font-size="14">Always loaded for all devs</text>

  <!-- Box 3: Path-Specific Rules -->
  <rect x="615" y="20" width="275" height="310" rx="16" fill="#ffffff" stroke="#6a55e4" stroke-width="3"/>
  <rect x="615" y="20" width="275" height="50" rx="16" fill="#6a55e4"/>
  <text x="752" y="52" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="700">3. Path-Scoped Rules</text>
  <text x="752" y="102" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700">.claude/rules/*.md</text>
  <text x="752" y="144" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="15">YAML frontmatter globs:</text>
  <text x="752" y="170" text-anchor="middle" fill="#6a55e4" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">paths: ["**/*.test.tsx"]</text>
  <rect x="635" y="212" width="235" height="90" rx="10" fill="#f3e8ff" stroke="#d8b4fe"/>
  <text x="752" y="246" text-anchor="middle" fill="#581c87" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">Conditional Activation</text>
  <text x="752" y="274" text-anchor="middle" fill="#6b21a8" font-family="Inter, system-ui, sans-serif" font-size="14">Spans any directory by glob</text>

  <!-- Box 4: Directory-Level -->
  <rect x="915" y="20" width="265" height="310" rx="16" fill="#ffffff" stroke="#082445" stroke-width="2.5"/>
  <rect x="915" y="20" width="265" height="50" rx="16" fill="#082445"/>
  <text x="1047" y="52" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="700">4. Subdirectory Scope</text>
  <text x="1047" y="102" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700">packages/api/CLAUDE.md</text>
  <text x="1047" y="144" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="15">Package-local rules</text>
  <text x="1047" y="170" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="15">for one directory tree</text>
  <rect x="935" y="212" width="225" height="90" rx="10" fill="#e0edff" stroke="#93c5fd"/>
  <text x="1047" y="246" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">Directory-Bound</text>
  <text x="1047" y="274" text-anchor="middle" fill="#1e3a8a" font-family="Inter, system-ui, sans-serif" font-size="14">Cannot match scattered files</text>
</svg>
