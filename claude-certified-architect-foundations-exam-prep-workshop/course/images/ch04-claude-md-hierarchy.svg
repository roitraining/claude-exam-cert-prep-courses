<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="CLAUDE.md and .claude/rules/ Configuration Hierarchy">
  <rect width="1200" height="440" rx="18" fill="#f4f8fc" stroke="#dbe5f0" stroke-width="2"/>
  <text x="600" y="50" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="700">Claude Code Memory and Rule Hierarchy</text>

  <!-- Box 1: User-Level -->
  <rect x="40" y="85" width="260" height="310" rx="16" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <rect x="40" y="85" width="260" height="48" rx="16" fill="#475569"/>
  <text x="170" y="116" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">1. User Scope</text>
  <text x="170" y="164" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700">~/.claude/CLAUDE.md</text>
  <text x="170" y="205" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="15">Personal preferences</text>
  <text x="170" y="232" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="15">across all projects</text>
  <rect x="60" y="275" width="220" height="80" rx="10" fill="#fef2f2"/>
  <text x="170" y="308" text-anchor="middle" fill="#991b1b" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">Not in Git!</text>
  <text x="170" y="332" text-anchor="middle" fill="#991b1b" font-family="Inter, system-ui, sans-serif" font-size="13">Teammates will not receive</text>

  <!-- Box 2: Project-Level -->
  <rect x="325" y="85" width="260" height="310" rx="16" fill="#ffffff" stroke="#1e71d6" stroke-width="3"/>
  <rect x="325" y="85" width="260" height="48" rx="16" fill="#1e71d6"/>
  <text x="455" y="116" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">2. Project Scope</text>
  <text x="455" y="164" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700">CLAUDE.md / .claude/CLAUDE.md</text>
  <text x="455" y="205" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="15">Universal team standards,</text>
  <text x="455" y="232" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="15">CI rules, and @import links</text>
  <rect x="345" y="275" width="220" height="80" rx="10" fill="#ecfdf5"/>
  <text x="455" y="308" text-anchor="middle" fill="#065f46" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">Shared via Git</text>
  <text x="455" y="332" text-anchor="middle" fill="#047857" font-family="Inter, system-ui, sans-serif" font-size="13">Always loaded for all devs</text>

  <!-- Box 3: Path-Specific Rules -->
  <rect x="610" y="85" width="265" height="310" rx="16" fill="#ffffff" stroke="#6a55e4" stroke-width="3"/>
  <rect x="610" y="85" width="265" height="48" rx="16" fill="#6a55e4"/>
  <text x="742" y="116" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">3. Path-Scoped Rules</text>
  <text x="742" y="164" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700">.claude/rules/*.md</text>
  <text x="742" y="205" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="15">YAML frontmatter globs:</text>
  <text x="742" y="232" text-anchor="middle" fill="#6a55e4" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600">paths: ["**/*.test.tsx"]</text>
  <rect x="630" y="275" width="225" height="80" rx="10" fill="#f3e8ff"/>
  <text x="742" y="308" text-anchor="middle" fill="#581c87" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">Conditional Activation</text>
  <text x="742" y="332" text-anchor="middle" fill="#6b21a8" font-family="Inter, system-ui, sans-serif" font-size="13">Spans any directory by glob</text>

  <!-- Box 4: Directory-Level -->
  <rect x="900" y="85" width="260" height="310" rx="16" fill="#ffffff" stroke="#082445" stroke-width="2"/>
  <rect x="900" y="85" width="260" height="48" rx="16" fill="#082445"/>
  <text x="1030" y="116" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">4. Subdirectory Scope</text>
  <text x="1030" y="164" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700">packages/api/CLAUDE.md</text>
  <text x="1030" y="205" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="15">Package-local rules</text>
  <text x="1030" y="232" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="15">for one directory tree</text>
  <rect x="920" y="275" width="220" height="80" rx="10" fill="#e2ecf7"/>
  <text x="1030" y="308" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">Directory-Bound</text>
  <text x="1030" y="332" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="13">Cannot match scattered files</text>
</svg>
