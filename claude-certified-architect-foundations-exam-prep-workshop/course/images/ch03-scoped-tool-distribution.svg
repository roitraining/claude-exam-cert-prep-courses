<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Scoped Tool Distribution vs Tool Bloat">
  <!-- Left Panel: Anti-pattern (18 un-scoped tools) -->
  <rect x="20" y="15" width="550" height="350" rx="16" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="295" y="56" text-anchor="middle" fill="#991b1b" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="700">Anti-Pattern: Unscoped Tool Bloat (18+ Tools)</text>
  <text x="295" y="86" text-anchor="middle" fill="#b91c1c" font-family="Inter, system-ui, sans-serif" font-size="16">Degrades selection reliability and invites cross-role misuse</text>

  <rect x="45" y="110" width="500" height="230" rx="12" fill="#ffffff" stroke="#fca5a5" stroke-width="2"/>
  <text x="295" y="146" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="700">Synthesis Agent Given All 18 Tools</text>
  <text x="295" y="182" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="15">web_search, scrape_site, raw_sql, fetch_url, delete_record,</text>
  <text x="295" y="208" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="15">analyze_content, analyze_document, run_bash, git_push...</text>
  <rect x="70" y="236" width="450" height="80" rx="8" fill="#fee2e2"/>
  <text x="295" y="266" text-anchor="middle" fill="#991b1b" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700">Failure Mode:</text>
  <text x="295" y="294" text-anchor="middle" fill="#991b1b" font-family="Inter, system-ui, sans-serif" font-size="15">Synthesis agent runs raw web searches instead of synthesizing</text>

  <!-- Right Panel: Best Practice (4-5 role-scoped tools + scoped cross-role helper) -->
  <rect x="600" y="15" width="580" height="350" rx="16" fill="#ecfdf5" stroke="#16a34a" stroke-width="2.5"/>
  <text x="890" y="56" text-anchor="middle" fill="#065f46" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="700">Best Practice: Role-Scoped Tool Sets (4 to 5 Tools)</text>
  <text x="890" y="86" text-anchor="middle" fill="#047857" font-family="Inter, system-ui, sans-serif" font-size="16">High selection accuracy + scoped cross-role fact check</text>

  <rect x="625" y="110" width="255" height="230" rx="12" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
  <text x="752" y="146" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="700">Doc Analysis Agent</text>
  <text x="752" y="182" text-anchor="middle" fill="#1e71d6" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600">• load_document</text>
  <text x="752" y="212" text-anchor="middle" fill="#1e71d6" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600">• extract_data_points</text>
  <text x="752" y="242" text-anchor="middle" fill="#1e71d6" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600">• summarize_content</text>
  <text x="752" y="295" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600">Constrained URL validation</text>

  <rect x="900" y="110" width="255" height="230" rx="12" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
  <text x="1027" y="146" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="700">Synthesis Agent</text>
  <text x="1027" y="182" text-anchor="middle" fill="#6a55e4" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600">• merge_citations</text>
  <text x="1027" y="212" text-anchor="middle" fill="#6a55e4" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600">• flag_conflicts</text>
  <text x="1027" y="242" text-anchor="middle" fill="#047857" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700">• verify_fact (85% case)</text>
  <text x="1027" y="295" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600">15% deep research -&gt; Coordinator</text>
</svg>
