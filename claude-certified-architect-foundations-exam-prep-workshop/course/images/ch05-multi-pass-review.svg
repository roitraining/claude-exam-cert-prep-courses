<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Multi-Pass Code Review Architecture">
  <defs>
    <marker id="arr-m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e71d6"/>
    </marker>
  </defs>

  <rect width="1200" height="420" rx="18" fill="#f4f8fc" stroke="#dbe5f0" stroke-width="2"/>
  <text x="600" y="46" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="700">Multi-Pass Review Architecture (Overcoming Attention Dilution on 14-File PRs)</text>

  <!-- PR Input -->
  <rect x="40" y="145" width="200" height="140" rx="14" fill="#082445"/>
  <text x="140" y="198" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700">Large PR Diff</text>
  <text x="140" y="230" text-anchor="middle" fill="#9eb6d4" font-family="Inter, system-ui, sans-serif" font-size="16">14 Modified Files</text>

  <line x1="240" y1="180" x2="310" y2="120" stroke="#1e71d6" stroke-width="3" marker-end="url(#arr-m)"/>
  <line x1="240" y1="215" x2="310" y2="215" stroke="#1e71d6" stroke-width="3" marker-end="url(#arr-m)"/>
  <line x1="240" y1="250" x2="310" y2="310" stroke="#1e71d6" stroke-width="3" marker-end="url(#arr-m)"/>

  <!-- Pass 1: Per-file passes -->
  <rect x="320" y="75" width="380" height="80" rx="12" fill="#ffffff" stroke="#1e71d6" stroke-width="3"/>
  <text x="510" y="110" text-anchor="middle" fill="#1e71d6" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700">Pass 1a: File 1 Local Analysis</text>
  <text x="510" y="135" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="14">Focused depth on logic, edge cases, and local bugs</text>

  <rect x="320" y="175" width="380" height="80" rx="12" fill="#ffffff" stroke="#1e71d6" stroke-width="3"/>
  <text x="510" y="210" text-anchor="middle" fill="#1e71d6" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700">Pass 1b: File 2 Local Analysis</text>
  <text x="510" y="235" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="14">Consistent criteria applied without attention dilution</text>

  <rect x="320" y="275" width="380" height="80" rx="12" fill="#ffffff" stroke="#1e71d6" stroke-width="3"/>
  <text x="510" y="310" text-anchor="middle" fill="#1e71d6" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700">Pass 1n: File 14 Local Analysis</text>
  <text x="510" y="335" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="14">No contradictory findings across identical code</text>

  <!-- Converge to Pass 2 -->
  <line x1="700" y1="115" x2="780" y2="190" stroke="#1e71d6" stroke-width="3" marker-end="url(#arr-m)"/>
  <line x1="700" y1="215" x2="780" y2="215" stroke="#1e71d6" stroke-width="3" marker-end="url(#arr-m)"/>
  <line x1="700" y1="315" x2="780" y2="240" stroke="#1e71d6" stroke-width="3" marker-end="url(#arr-m)"/>

  <!-- Pass 2: Cross-File Integration Pass -->
  <rect x="790" y="125" width="370" height="180" rx="16" fill="#6a55e4"/>
  <text x="975" y="175" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700">Pass 2: Cross-File Integration</text>
  <text x="975" y="210" text-anchor="middle" fill="#e9d5ff" font-family="Inter, system-ui, sans-serif" font-size="16">Examines cross-module data flows,</text>
  <text x="975" y="236" text-anchor="middle" fill="#e9d5ff" font-family="Inter, system-ui, sans-serif" font-size="16">API contract mismatches, and</text>
  <text x="975" y="262" text-anchor="middle" fill="#e9d5ff" font-family="Inter, system-ui, sans-serif" font-size="16">breaking interface changes</text>
</svg>
