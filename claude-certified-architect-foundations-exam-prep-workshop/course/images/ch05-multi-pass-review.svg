<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Multi-Pass Code Review Architecture">
  <defs>
    <marker id="arr-m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e71d6"/>
    </marker>
  </defs>

  <!-- PR Input -->
  <rect x="25" y="100" width="210" height="140" rx="14" fill="#082445"/>
  <text x="130" y="158" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700">Large PR Diff</text>
  <text x="130" y="192" text-anchor="middle" fill="#9eb6d4" font-family="Inter, system-ui, sans-serif" font-size="16">14 Modified Files</text>

  <line x1="235" y1="135" x2="305" y2="70" stroke="#1e71d6" stroke-width="3" marker-end="url(#arr-m)"/>
  <line x1="235" y1="170" x2="305" y2="170" stroke="#1e71d6" stroke-width="3" marker-end="url(#arr-m)"/>
  <line x1="235" y1="205" x2="305" y2="270" stroke="#1e71d6" stroke-width="3" marker-end="url(#arr-m)"/>

  <!-- Pass 1: Per-file passes -->
  <rect x="315" y="25" width="390" height="84" rx="12" fill="#ffffff" stroke="#1e71d6" stroke-width="3"/>
  <text x="510" y="60" text-anchor="middle" fill="#1e71d6" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">Pass 1a: File 1 Local Analysis</text>
  <text x="510" y="88" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="15">Focused depth on logic, edge cases, and local bugs</text>

  <rect x="315" y="128" width="390" height="84" rx="12" fill="#ffffff" stroke="#1e71d6" stroke-width="3"/>
  <text x="510" y="163" text-anchor="middle" fill="#1e71d6" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">Pass 1b: File 2 Local Analysis</text>
  <text x="510" y="191" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="15">Consistent criteria applied without attention dilution</text>

  <rect x="315" y="231" width="390" height="84" rx="12" fill="#ffffff" stroke="#1e71d6" stroke-width="3"/>
  <text x="510" y="266" text-anchor="middle" fill="#1e71d6" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">Pass 1n: File 14 Local Analysis</text>
  <text x="510" y="294" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="15">No contradictory findings across identical code</text>

  <!-- Converge to Pass 2 -->
  <line x1="705" y1="67" x2="785" y2="145" stroke="#1e71d6" stroke-width="3" marker-end="url(#arr-m)"/>
  <line x1="705" y1="170" x2="785" y2="170" stroke="#1e71d6" stroke-width="3" marker-end="url(#arr-m)"/>
  <line x1="705" y1="273" x2="785" y2="195" stroke="#1e71d6" stroke-width="3" marker-end="url(#arr-m)"/>

  <!-- Pass 2: Cross-File Integration Pass -->
  <rect x="795" y="80" width="380" height="180" rx="16" fill="#6a55e4"/>
  <text x="985" y="130" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700">Pass 2: Cross-File Integration</text>
  <text x="985" y="168" text-anchor="middle" fill="#f3e8ff" font-family="Inter, system-ui, sans-serif" font-size="16">Examines cross-module data flows,</text>
  <text x="985" y="196" text-anchor="middle" fill="#f3e8ff" font-family="Inter, system-ui, sans-serif" font-size="16">API contract mismatches, and</text>
  <text x="985" y="224" text-anchor="middle" fill="#f3e8ff" font-family="Inter, system-ui, sans-serif" font-size="16">breaking interface changes</text>
</svg>
