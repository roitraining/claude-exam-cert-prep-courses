<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Agentic Loop Lifecycle based on stop_reason">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e71d6"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="1200" height="420" rx="18" fill="#f4f8fc" stroke="#dbe5f0" stroke-width="2"/>

  <!-- Step 1: Send messages -->
  <rect x="40" y="130" width="210" height="110" rx="14" fill="#082445"/>
  <text x="145" y="175" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700">1. Call Claude API</text>
  <text x="145" y="205" text-anchor="middle" fill="#9eb6d4" font-family="Inter, system-ui, sans-serif" font-size="15">Send messages + tools</text>

  <line x1="250" y1="185" x2="310" y2="185" stroke="#1e71d6" stroke-width="4" marker-end="url(#arr)"/>

  <!-- Step 2: Inspect stop_reason -->
  <rect x="320" y="120" width="250" height="130" rx="14" fill="#1e71d6"/>
  <text x="445" y="168" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700">2. Inspect stop_reason</text>
  <text x="445" y="198" text-anchor="middle" fill="#e0edff" font-family="Inter, system-ui, sans-serif" font-size="16">"tool_use" vs "end_turn"</text>
  <text x="445" y="224" text-anchor="middle" fill="#bfdbfe" font-family="Inter, system-ui, sans-serif" font-size="14">Never parse prose to stop</text>

  <!-- Branch A: tool_use -->
  <line x1="570" y1="160" x2="660" y2="110" stroke="#1e71d6" stroke-width="4" marker-end="url(#arr)"/>
  <text x="615" y="115" text-anchor="middle" fill="#1e71d6" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">"tool_use"</text>

  <rect x="670" y="50" width="230" height="105" rx="14" fill="#ffffff" stroke="#1e71d6" stroke-width="3"/>
  <text x="785" y="95" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="700">3. Execute Tool(s)</text>
  <text x="785" y="125" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="15">Run hooks + MCP/local tool</text>

  <line x1="900" y1="102" x2="950" y2="102" stroke="#1e71d6" stroke-width="4" marker-end="url(#arr)"/>

  <rect x="960" y="50" width="205" height="105" rx="14" fill="#ffffff" stroke="#1e71d6" stroke-width="3"/>
  <text x="1062" y="92" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">4. Append History</text>
  <text x="1062" y="120" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="14">Add assistant + tool_result</text>

  <!-- Loop back path -->
  <path d="M 1062 50 V 22 H 145 V 122" fill="none" stroke="#1e71d6" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arr)"/>
  <text x="600" y="42" text-anchor="middle" fill="#1e71d6" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600">Continue loop with updated conversation history</text>

  <!-- Branch B: end_turn -->
  <line x1="570" y1="215" x2="660" y2="290" stroke="#16a34a" stroke-width="4" marker-end="url(#arr-green)"/>
  <text x="615" y="275" text-anchor="middle" fill="#16a34a" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">"end_turn"</text>

  <rect x="670" y="250" width="495" height="110" rx="14" fill="#ecfdf5" stroke="#16a34a" stroke-width="3"/>
  <text x="917" y="298" text-anchor="middle" fill="#065f46" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="700">Terminate Loop and Return Final Response</text>
  <text x="917" y="330" text-anchor="middle" fill="#047857" font-family="Inter, system-ui, sans-serif" font-size="16">Model has completed reasoning and requires no further tool calls</text>
</svg>
