<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Agentic Loop Lifecycle based on stop_reason">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e71d6"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Step 1: Send messages -->
  <rect x="20" y="135" width="225" height="115" rx="14" fill="#082445"/>
  <text x="132" y="182" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700">1. Call Claude API</text>
  <text x="132" y="214" text-anchor="middle" fill="#9eb6d4" font-family="Inter, system-ui, sans-serif" font-size="16">Send messages + tools</text>

  <line x1="245" y1="192" x2="300" y2="192" stroke="#1e71d6" stroke-width="4" marker-end="url(#arr)"/>

  <!-- Step 2: Inspect stop_reason -->
  <rect x="310" y="125" width="265" height="135" rx="14" fill="#1e71d6"/>
  <text x="442" y="170" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700">2. Inspect stop_reason</text>
  <text x="442" y="202" text-anchor="middle" fill="#e0edff" font-family="Inter, system-ui, sans-serif" font-size="16">"tool_use" vs "end_turn"</text>
  <text x="442" y="232" text-anchor="middle" fill="#bfdbfe" font-family="Inter, system-ui, sans-serif" font-size="15">Never parse prose to stop</text>

  <!-- Branch A: tool_use -->
  <line x1="575" y1="165" x2="660" y2="120" stroke="#1e71d6" stroke-width="4" marker-end="url(#arr)"/>
  <text x="615" y="125" text-anchor="middle" fill="#1e71d6" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700">"tool_use"</text>

  <rect x="670" y="65" width="235" height="110" rx="14" fill="#ffffff" stroke="#1e71d6" stroke-width="3"/>
  <text x="787" y="112" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="700">3. Execute Tool(s)</text>
  <text x="787" y="142" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="15">Run hooks + MCP/local tool</text>

  <line x1="905" y1="120" x2="945" y2="120" stroke="#1e71d6" stroke-width="4" marker-end="url(#arr)"/>

  <rect x="955" y="65" width="225" height="110" rx="14" fill="#ffffff" stroke="#1e71d6" stroke-width="3"/>
  <text x="1067" y="112" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="700">4. Append History</text>
  <text x="1067" y="142" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="15">Add assistant + tool_result</text>

  <!-- Loop back path -->
  <path d="M 1067 65 V 22 H 132 V 125" fill="none" stroke="#1e71d6" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arr)"/>
  <rect x="370" y="4" width="460" height="32" rx="6" fill="#e0edff"/>
  <text x="600" y="25" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">Continue loop with updated conversation history</text>

  <!-- Branch B: end_turn -->
  <line x1="575" y1="220" x2="660" y2="290" stroke="#16a34a" stroke-width="4" marker-end="url(#arr-green)"/>
  <text x="615" y="280" text-anchor="middle" fill="#16a34a" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700">"end_turn"</text>

  <rect x="670" y="245" width="510" height="110" rx="14" fill="#ecfdf5" stroke="#16a34a" stroke-width="3"/>
  <text x="925" y="292" text-anchor="middle" fill="#065f46" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="700">Terminate Loop and Return Final Response</text>
  <text x="925" y="325" text-anchor="middle" fill="#047857" font-family="Inter, system-ui, sans-serif" font-size="16">Model has completed reasoning and requires no further tool calls</text>
</svg>
