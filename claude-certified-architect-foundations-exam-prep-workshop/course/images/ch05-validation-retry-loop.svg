<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Validation and Retry Feedback Loop Architecture">
  <defs>
    <marker id="arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e71d6"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="1200" height="420" rx="18" fill="#f4f8fc" stroke="#dbe5f0" stroke-width="2"/>

  <!-- Step 1: Source Document -->
  <rect x="35" y="145" width="215" height="120" rx="14" fill="#082445"/>
  <text x="142" y="195" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="700">1. Source Document</text>
  <text x="142" y="225" text-anchor="middle" fill="#9eb6d4" font-family="Inter, system-ui, sans-serif" font-size="15">+ Few-shot prompt</text>

  <line x1="250" y1="205" x2="305" y2="205" stroke="#1e71d6" stroke-width="4" marker-end="url(#arr-b)"/>

  <!-- Step 2: tool_use Extraction -->
  <rect x="315" y="135" width="250" height="140" rx="14" fill="#1e71d6"/>
  <text x="440" y="185" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="700">2. Claude tool_use</text>
  <text x="440" y="215" text-anchor="middle" fill="#e0edff" font-family="Inter, system-ui, sans-serif" font-size="15">Strict JSON Schema</text>
  <text x="440" y="242" text-anchor="middle" fill="#bfdbfe" font-family="Inter, system-ui, sans-serif" font-size="14">(No syntax errors)</text>

  <line x1="565" y1="205" x2="620" y2="205" stroke="#1e71d6" stroke-width="4" marker-end="url(#arr-b)"/>

  <!-- Step 3: Pydantic / Semantic Validator -->
  <rect x="630" y="135" width="260" height="140" rx="14" fill="#ffffff" stroke="#1e71d6" stroke-width="3"/>
  <text x="760" y="182" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="700">3. Semantic Validator</text>
  <text x="760" y="212" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="15">Pydantic / Cross-field sum</text>
  <text x="760" y="238" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="14">(calculated_total == stated_total)</text>

  <!-- Retry Loop Top Path -->
  <path d="M 760 135 V 48 H 440 V 125" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#arr-r)"/>
  <rect x="470" y="22" width="265" height="52" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="602" y="45" text-anchor="middle" fill="#991b1b" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">Retry with Error Feedback:</text>
  <text x="602" y="64" text-anchor="middle" fill="#991b1b" font-family="Inter, system-ui, sans-serif" font-size="13">Send Doc + Failed JSON + Exact Error</text>

  <!-- Pass Path -->
  <line x1="890" y1="205" x2="945" y2="205" stroke="#16a34a" stroke-width="4" marker-end="url(#arr-g)"/>
  <rect x="955" y="145" width="210" height="120" rx="14" fill="#ecfdf5" stroke="#16a34a" stroke-width="3"/>
  <text x="1060" y="195" text-anchor="middle" fill="#065f46" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="700">4. Downstream</text>
  <text x="1060" y="225" text-anchor="middle" fill="#047857" font-family="Inter, system-ui, sans-serif" font-size="15">Verified JSON Output</text>

  <!-- Bottom note -->
  <rect x="140" y="325" width="920" height="54" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="600" y="358" text-anchor="middle" fill="#92400e" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700">Note: Retries fix structural/format/math errors, but CANNOT fix data that is absent from the source document.</text>
</svg>
