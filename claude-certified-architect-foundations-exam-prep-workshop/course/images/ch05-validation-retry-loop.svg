<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Validation and Retry Feedback Loop Architecture">
  <defs>
    <marker id="arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e71d6"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Step 1: Source Document -->
  <rect x="25" y="125" width="220" height="125" rx="14" fill="#082445"/>
  <text x="135" y="178" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="700">1. Source Document</text>
  <text x="135" y="210" text-anchor="middle" fill="#9eb6d4" font-family="Inter, system-ui, sans-serif" font-size="16">+ Few-shot prompt</text>

  <line x1="245" y1="188" x2="295" y2="188" stroke="#1e71d6" stroke-width="4" marker-end="url(#arr-b)"/>

  <!-- Step 2: tool_use Extraction -->
  <rect x="305" y="115" width="255" height="145" rx="14" fill="#1e71d6"/>
  <text x="432" y="166" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="700">2. Claude tool_use</text>
  <text x="432" y="198" text-anchor="middle" fill="#e0edff" font-family="Inter, system-ui, sans-serif" font-size="16">Strict JSON Schema</text>
  <text x="432" y="226" text-anchor="middle" fill="#bfdbfe" font-family="Inter, system-ui, sans-serif" font-size="15">(No syntax errors)</text>

  <line x1="560" y1="188" x2="610" y2="188" stroke="#1e71d6" stroke-width="4" marker-end="url(#arr-b)"/>

  <!-- Step 3: Pydantic / Semantic Validator -->
  <rect x="620" y="115" width="275" height="145" rx="14" fill="#ffffff" stroke="#1e71d6" stroke-width="3"/>
  <text x="757" y="164" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="700">3. Semantic Validator</text>
  <text x="757" y="196" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="15">Pydantic / Cross-field sum</text>
  <text x="757" y="224" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600">(calculated_total == stated_total)</text>

  <!-- Retry Loop Top Path -->
  <path d="M 757 115 V 36 H 432 V 105" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#arr-r)"/>
  <rect x="455" y="8" width="285" height="56" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="597" y="32" text-anchor="middle" fill="#991b1b" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">Retry with Error Feedback:</text>
  <text x="597" y="52" text-anchor="middle" fill="#991b1b" font-family="Inter, system-ui, sans-serif" font-size="13">Send Doc + Failed JSON + Exact Error</text>

  <!-- Pass Path -->
  <line x1="895" y1="188" x2="945" y2="188" stroke="#16a34a" stroke-width="4" marker-end="url(#arr-g)"/>
  <rect x="955" y="125" width="220" height="125" rx="14" fill="#ecfdf5" stroke="#16a34a" stroke-width="3"/>
  <text x="1065" y="178" text-anchor="middle" fill="#065f46" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="700">4. Downstream</text>
  <text x="1065" y="210" text-anchor="middle" fill="#047857" font-family="Inter, system-ui, sans-serif" font-size="16">Verified JSON Output</text>

  <!-- Bottom note -->
  <rect x="100" y="295" width="1000" height="56" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="600" y="330" text-anchor="middle" fill="#92400e" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700">Retries fix structural/format/math errors, but CANNOT fix data that is absent from the source document.</text>
</svg>
