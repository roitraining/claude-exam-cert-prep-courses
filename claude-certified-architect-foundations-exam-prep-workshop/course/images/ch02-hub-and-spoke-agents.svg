<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 780" width="1600" height="780" role="img" aria-label="Hub-and-Spoke Coordinator and Subagent Architecture">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e71d6"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6a55e4"/>
    </marker>
  </defs>

  <!-- Central Hub: Coordinator Agent -->
  <rect x="480" y="30" width="640" height="220" rx="22" fill="#082445"/>
  <text x="800" y="85" text-anchor="middle" fill="#9eb6d4" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" letter-spacing="2">HUB: COORDINATOR AGENT</text>
  <text x="800" y="132" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="30" font-weight="700">Task Decomposition and Routing</text>
  <text x="800" y="176" text-anchor="middle" fill="#e2ecf7" font-family="Inter, system-ui, sans-serif" font-size="20">allowedTools: ["Task"] | Spawns parallel subagents</text>
  <text x="800" y="214" text-anchor="middle" fill="#9eb6d4" font-family="Inter, system-ui, sans-serif" font-size="18">Evaluates synthesis gaps and manages error recovery</text>

  <!-- Arrows from Coordinator to Subagents -->
  <path d="M 580 250 L 225 415" stroke="#1e71d6" stroke-width="4" marker-end="url(#arrow-blue)" marker-start="url(#arrow-blue)"/>
  <path d="M 720 250 L 605 415" stroke="#1e71d6" stroke-width="4" marker-end="url(#arrow-blue)" marker-start="url(#arrow-blue)"/>
  <path d="M 880 250 L 995 415" stroke="#6a55e4" stroke-width="4" marker-end="url(#arrow-purple)" marker-start="url(#arrow-purple)"/>
  <path d="M 1020 250 L 1375 415" stroke="#6a55e4" stroke-width="4" marker-end="url(#arrow-purple)" marker-start="url(#arrow-purple)"/>

  <!-- Explicit Context Banner -->
  <rect x="260" y="305" width="1080" height="52" rx="10" fill="#e0edff" stroke="#1e71d6" stroke-width="2"/>
  <text x="800" y="338" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="700">Explicit Context Boundary: Subagents Have Isolated Context (No Automatic History Inheritance)</text>

  <!-- Spoke 1: Web Search Subagent -->
  <rect x="45" y="430" width="355" height="250" rx="18" fill="#ffffff" stroke="#1e71d6" stroke-width="3"/>
  <text x="222" y="476" text-anchor="middle" fill="#1e71d6" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">SPOKE 1 (PARALLEL TASK)</text>
  <text x="222" y="516" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="700">Web Search Agent</text>
  <text x="222" y="560" text-anchor="middle" fill="#1e3a8a" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="600">Tools: web_search, fetch_url</text>
  <text x="222" y="600" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="17">Returns structured claims,</text>
  <text x="222" y="628" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="17">URLs, excerpts, and dates</text>

  <!-- Spoke 2: Document Analysis Subagent -->
  <rect x="428" y="430" width="355" height="250" rx="18" fill="#ffffff" stroke="#1e71d6" stroke-width="3"/>
  <text x="605" y="476" text-anchor="middle" fill="#1e71d6" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">SPOKE 2 (PARALLEL TASK)</text>
  <text x="605" y="516" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="700">Doc Analysis Agent</text>
  <text x="605" y="560" text-anchor="middle" fill="#1e3a8a" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="600">Tools: load_document, extract</text>
  <text x="605" y="600" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="17">Returns structured findings,</text>
  <text x="605" y="628" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="17">doc names, and page numbers</text>

  <!-- Spoke 3: Synthesis Subagent -->
  <rect x="812" y="430" width="355" height="250" rx="18" fill="#ffffff" stroke="#6a55e4" stroke-width="3"/>
  <text x="989" y="476" text-anchor="middle" fill="#6a55e4" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">SPOKE 3 (RECEIVES FINDINGS)</text>
  <text x="989" y="516" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="700">Synthesis Agent</text>
  <text x="989" y="560" text-anchor="middle" fill="#581c87" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="600">Tools: verify_fact (scoped)</text>
  <text x="989" y="600" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="17">Merges claim-source mappings</text>
  <text x="989" y="628" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="17">and flags contested statistics</text>

  <!-- Spoke 4: Report Subagent -->
  <rect x="1195" y="430" width="360" height="250" rx="18" fill="#ffffff" stroke="#6a55e4" stroke-width="3"/>
  <text x="1375" y="476" text-anchor="middle" fill="#6a55e4" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">SPOKE 4 (FINAL FORMATTING)</text>
  <text x="1375" y="516" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="700">Report Generator</text>
  <text x="1375" y="560" text-anchor="middle" fill="#581c87" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="600">Tools: format_report</text>
  <text x="1375" y="600" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="17">Renders tables, prose, and</text>
  <text x="1375" y="628" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="17">coverage gap annotations</text>

  <!-- Bottom rule bar -->
  <rect x="45" y="705" width="1510" height="54" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="800" y="739" text-anchor="middle" fill="#991b1b" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="700">No Direct Peer-to-Peer Subagent Communication: All Handoffs Route Through the Coordinator</text>
</svg>
