<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" width="1100" height="360" role="img" aria-label="Lab 2 Overview: MCP Tool Design, CLAUDE.md Hierarchy, Path Rules, and Isolated Skills">
  <!-- Panel 1: MCP Tool Interfaces & Structured Errors -->
  <rect x="20" y="25" width="335" height="310" rx="14" fill="#ffffff" stroke="#1e71d6" stroke-width="3"/>
  <rect x="20" y="25" width="335" height="48" rx="14" fill="#1e71d6"/>
  <text x="187" y="55" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">Task 1: MCP Tools and Errors</text>
  <rect x="42" y="92" width="290" height="92" rx="10" fill="#e0edff"/>
  <text x="187" y="118" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">Clear Boundary Descriptions</text>
  <text x="187" y="142" text-anchor="middle" fill="#1e3a8a" font-family="Inter, system-ui, sans-serif" font-size="13">get_customer (email/phone/name)</text>
  <text x="187" y="164" text-anchor="middle" fill="#1e3a8a" font-family="Inter, system-ui, sans-serif" font-size="13">lookup_order (ORD-XXXXX / #12345)</text>
  <rect x="42" y="202" width="290" height="108" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="187" y="228" text-anchor="middle" fill="#991b1b" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">Structured MCP isError</text>
  <text x="187" y="252" text-anchor="middle" fill="#7f1d1d" font-family="Inter, system-ui, sans-serif" font-size="13">errorCategory + isRetryable + message</text>
  <text x="187" y="276" text-anchor="middle" fill="#065f46" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600">Empty match = isError: false, []</text>

  <!-- Panel 2: CLAUDE.md Hierarchy, .claude/rules/, .mcp.json -->
  <rect x="382" y="25" width="335" height="310" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="3"/>
  <rect x="382" y="25" width="335" height="48" rx="14" fill="#16a34a"/>
  <text x="550" y="55" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">Task 2: Project Config and Rules</text>
  <rect x="405" y="92" width="290" height="64" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  <text x="550" y="118" text-anchor="middle" fill="#065f46" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">Project CLAUDE.md + @import</text>
  <text x="550" y="140" text-anchor="middle" fill="#047857" font-family="Inter, system-ui, sans-serif" font-size="13">Shared in Git + inspect via /memory</text>
  <rect x="405" y="170" width="290" height="64" rx="10" fill="#f3e8ff" stroke="#d8b4fe"/>
  <text x="550" y="196" text-anchor="middle" fill="#581c87" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">.claude/rules/testing.md</text>
  <text x="550" y="218" text-anchor="middle" fill="#6b21a8" font-family="Inter, system-ui, sans-serif" font-size="13">paths: ["**/*.test.ts", "**/*.test.tsx"]</text>
  <rect x="405" y="248" width="290" height="62" rx="10" fill="#e0edff" stroke="#93c5fd"/>
  <text x="550" y="274" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">.mcp.json Secrets</text>
  <text x="550" y="296" text-anchor="middle" fill="#1e3a8a" font-family="Inter, system-ui, sans-serif" font-size="13">Env expansion: "${GITHUB_TOKEN}"</text>

  <!-- Panel 3: Commands, Forked Skills, and CI/CD -->
  <rect x="745" y="25" width="335" height="310" rx="14" fill="#ffffff" stroke="#6a55e4" stroke-width="3"/>
  <rect x="745" y="25" width="335" height="48" rx="14" fill="#6a55e4"/>
  <text x="912" y="55" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">Task 3 and 4: Skills and CI CLI</text>
  <rect x="768" y="92" width="290" height="64" rx="10" fill="#f3e8ff" stroke="#d8b4fe"/>
  <text x="912" y="118" text-anchor="middle" fill="#581c87" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">.claude/commands/review.md</text>
  <text x="912" y="140" text-anchor="middle" fill="#6b21a8" font-family="Inter, system-ui, sans-serif" font-size="13">Project-scoped /review command</text>
  <rect x="768" y="170" width="290" height="64" rx="10" fill="#e0edff" stroke="#93c5fd"/>
  <text x="912" y="196" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">.claude/skills/security-audit/</text>
  <text x="912" y="218" text-anchor="middle" fill="#1e3a8a" font-family="Inter, system-ui, sans-serif" font-size="13">context: fork | allowed-tools</text>
  <rect x="768" y="248" width="290" height="62" rx="10" fill="#082445"/>
  <text x="912" y="274" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">Non-Interactive CI Mode</text>
  <text x="912" y="296" text-anchor="middle" fill="#9eb6d4" font-family="Inter, system-ui, sans-serif" font-size="13">claude -p --output-format json</text>
</svg>
