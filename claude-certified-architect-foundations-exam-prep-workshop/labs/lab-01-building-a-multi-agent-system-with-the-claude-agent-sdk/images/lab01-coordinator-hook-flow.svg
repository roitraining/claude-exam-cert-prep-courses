<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" width="1100" height="360" role="img" aria-label="Lab 1 Architecture: Agentic Loop, SDK Hooks, and Parallel Subagents">
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e71d6"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6a55e4"/>
    </marker>
  </defs>

  <!-- Task 1: Agentic Loop -->
  <rect x="20" y="25" width="320" height="310" rx="14" fill="#ffffff" stroke="#1e71d6" stroke-width="3"/>
  <rect x="20" y="25" width="320" height="48" rx="14" fill="#1e71d6"/>
  <text x="180" y="55" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">Task 1: stop_reason Loop</text>
  <rect x="45" y="95" width="270" height="64" rx="10" fill="#e0edff"/>
  <text x="180" y="123" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">stop_reason == "tool_use"</text>
  <text x="180" y="146" text-anchor="middle" fill="#1e3a8a" font-family="Inter, system-ui, sans-serif" font-size="14">Run tools + append tool_result</text>
  <rect x="45" y="178" width="270" height="64" rx="10" fill="#ecfdf5" stroke="#86efac"/>
  <text x="180" y="206" text-anchor="middle" fill="#065f46" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">stop_reason == "end_turn"</text>
  <text x="180" y="229" text-anchor="middle" fill="#047857" font-family="Inter, system-ui, sans-serif" font-size="14">Exit loop and return final answer</text>
  <text x="180" y="285" text-anchor="middle" fill="#991b1b" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600">Never parse text or stop on prose</text>

  <line x1="340" y1="180" x2="380" y2="180" stroke="#1e71d6" stroke-width="3" marker-end="url(#arr-blue)"/>

  <!-- Task 2: SDK Compliance Hooks -->
  <rect x="390" y="25" width="320" height="310" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="3"/>
  <rect x="390" y="25" width="320" height="48" rx="14" fill="#16a34a"/>
  <text x="550" y="55" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">Task 2: Deterministic Hooks</text>
  <rect x="415" y="95" width="270" height="92" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="550" y="122" text-anchor="middle" fill="#991b1b" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">PreToolUse Gate</text>
  <text x="550" y="146" text-anchor="middle" fill="#7f1d1d" font-family="Inter, system-ui, sans-serif" font-size="14">1. Require verified customer ID</text>
  <text x="550" y="168" text-anchor="middle" fill="#7f1d1d" font-family="Inter, system-ui, sans-serif" font-size="14">2. Block refund &gt; $500 -&gt; escalate</text>
  <rect x="415" y="205" width="270" height="78" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  <text x="550" y="232" text-anchor="middle" fill="#065f46" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">PostToolUse Normalizer</text>
  <text x="550" y="256" text-anchor="middle" fill="#047857" font-family="Inter, system-ui, sans-serif" font-size="14">Convert Unix timestamps to ISO</text>

  <line x1="710" y1="180" x2="750" y2="180" stroke="#6a55e4" stroke-width="3" marker-end="url(#arr-purple)"/>

  <!-- Task 3: Coordinator + Parallel Subagents -->
  <rect x="760" y="25" width="320" height="310" rx="14" fill="#ffffff" stroke="#6a55e4" stroke-width="3"/>
  <rect x="760" y="25" width="320" height="48" rx="14" fill="#6a55e4"/>
  <text x="920" y="55" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">Task 3: Hub-and-Spoke Task</text>
  <rect x="785" y="95" width="270" height="58" rx="10" fill="#082445"/>
  <text x="920" y="121" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">Coordinator: allowedTools: ["Task"]</text>
  <text x="920" y="142" text-anchor="middle" fill="#9eb6d4" font-family="Inter, system-ui, sans-serif" font-size="13">Emits parallel Task calls in 1 turn</text>
  <rect x="785" y="170" width="128" height="65" rx="8" fill="#f3e8ff" stroke="#d8b4fe"/>
  <text x="849" y="198" text-anchor="middle" fill="#581c87" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">web-search</text>
  <text x="849" y="218" text-anchor="middle" fill="#6b21a8" font-family="Inter, system-ui, sans-serif" font-size="12">Isolated context</text>
  <rect x="927" y="170" width="128" height="65" rx="8" fill="#f3e8ff" stroke="#d8b4fe"/>
  <text x="991" y="198" text-anchor="middle" fill="#581c87" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">doc-analysis</text>
  <text x="991" y="218" text-anchor="middle" fill="#6b21a8" font-family="Inter, system-ui, sans-serif" font-size="12">Isolated context</text>
  <rect x="785" y="250" width="270" height="62" rx="8" fill="#e0edff" stroke="#93c5fd"/>
  <text x="920" y="276" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">synthesis subagent</text>
  <text x="920" y="297" text-anchor="middle" fill="#1e3a8a" font-family="Inter, system-ui, sans-serif" font-size="13">Receives explicit structured findings</text>
</svg>
