<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="1200" height="350" role="img" aria-label="Model Context Protocol Architecture and Core Primitives">
  <defs>
    <marker id="arr-mcp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e71d6"/>
    </marker>
  </defs>

  <!-- Left: MCP Host + Client -->
  <rect x="20" y="15" width="335" height="320" rx="16" fill="#082445"/>
  <text x="187" y="56" text-anchor="middle" fill="#9eb6d4" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1.4">MCP HOST APPLICATION</text>
  <text x="187" y="90" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700">Claude Code / Desktop / App</text>

  <rect x="50" y="120" width="275" height="90" rx="10" fill="#1e3a8a"/>
  <text x="187" y="154" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700">MCP Client 1..N</text>
  <text x="187" y="182" text-anchor="middle" fill="#bfdbfe" font-family="Inter, system-ui, sans-serif" font-size="14">1:1 stateful session per server</text>

  <text x="187" y="250" text-anchor="middle" fill="#e2ecf7" font-family="Inter, system-ui, sans-serif" font-size="15">Discovers capabilities at connect</text>
  <text x="187" y="278" text-anchor="middle" fill="#e2ecf7" font-family="Inter, system-ui, sans-serif" font-size="15">Enforces human approval gates</text>

  <!-- Transport Arrows -->
  <path d="M 355 165 H 525" stroke="#1e71d6" stroke-width="4" marker-end="url(#arr-mcp)" marker-start="url(#arr-mcp)"/>
  <rect x="370" y="95" width="140" height="50" rx="8" fill="#e0edff" stroke="#1e71d6" stroke-width="2"/>
  <text x="440" y="118" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">JSON-RPC 2.0</text>
  <text x="440" y="136" text-anchor="middle" fill="#1e71d6" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">stdio | HTTP/SSE</text>

  <!-- Right: MCP Server and 3 Primitives -->
  <rect x="535" y="15" width="645" height="320" rx="16" fill="#ffffff" stroke="#1e71d6" stroke-width="3"/>
  <rect x="535" y="15" width="645" height="50" rx="16" fill="#1e71d6"/>
  <text x="857" y="47" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="700">MCP Server (Reusable Across Multiple Claude Apps)</text>

  <!-- Primitive 1: Tools -->
  <rect x="558" y="86" width="190" height="225" rx="12" fill="#f0f7ff" stroke="#1e71d6" stroke-width="2"/>
  <text x="653" y="120" text-anchor="middle" fill="#1e71d6" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">1. Tools</text>
  <text x="653" y="146" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">(Model-Controlled)</text>
  <text x="653" y="180" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="14">Executable functions</text>
  <text x="653" y="204" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="14">with JSON Schema</text>
  <text x="653" y="228" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="14">inputs and isError</text>
  <text x="653" y="275" text-anchor="middle" fill="#1e71d6" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">e.g. reserve_inventory</text>

  <!-- Primitive 2: Resources -->
  <rect x="762" y="86" width="190" height="225" rx="12" fill="#faf5ff" stroke="#6a55e4" stroke-width="2"/>
  <text x="857" y="120" text-anchor="middle" fill="#6a55e4" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">2. Resources</text>
  <text x="857" y="146" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">(App-Controlled)</text>
  <text x="857" y="180" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="14">Read-only URI data</text>
  <text x="857" y="204" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="14">catalogs, schemas,</text>
  <text x="857" y="228" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="14">and doc trees</text>
  <text x="857" y="275" text-anchor="middle" fill="#6a55e4" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">e.g. db://schema/items</text>

  <!-- Primitive 3: Prompts -->
  <rect x="966" y="86" width="190" height="225" rx="12" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="1061" y="120" text-anchor="middle" fill="#16a34a" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">3. Prompts</text>
  <text x="1061" y="146" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">(User-Controlled)</text>
  <text x="1061" y="180" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="14">Pre-built workflow</text>
  <text x="1061" y="204" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="14">templates exposed</text>
  <text x="1061" y="228" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="14">as slash commands</text>
  <text x="1061" y="275" text-anchor="middle" fill="#16a34a" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">e.g. /audit-inventory</text>
</svg>
