<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-label="Model Context Protocol Architecture and Core Primitives">
  <defs>
    <marker id="arr-mcp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e71d6"/>
    </marker>
  </defs>

  <rect width="1200" height="430" rx="18" fill="#f4f8fc" stroke="#dbe5f0" stroke-width="2"/>
  <text x="600" y="46" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="700">Model Context Protocol (MCP): Host/Client Architecture and Three Core Primitives</text>

  <!-- Left: MCP Host + Client -->
  <rect x="35" y="80" width="320" height="310" rx="16" fill="#082445"/>
  <text x="195" y="120" text-anchor="middle" fill="#9eb6d4" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1.4">MCP HOST APPLICATION</text>
  <text x="195" y="152" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="700">Claude Code / Desktop / App</text>

  <rect x="65" y="180" width="260" height="85" rx="10" fill="#1e3a8a"/>
  <text x="195" y="212" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700">MCP Client 1..N</text>
  <text x="195" y="238" text-anchor="middle" fill="#bfdbfe" font-family="Inter, system-ui, sans-serif" font-size="13">1:1 stateful session per server</text>

  <text x="195" y="305" text-anchor="middle" fill="#e2ecf7" font-family="Inter, system-ui, sans-serif" font-size="14">Discovers capabilities at connect</text>
  <text x="195" y="328" text-anchor="middle" fill="#e2ecf7" font-family="Inter, system-ui, sans-serif" font-size="14">Enforces human approval gates</text>

  <!-- Transport Arrows -->
  <path d="M 355 215 H 525" stroke="#1e71d6" stroke-width="4" marker-end="url(#arr-mcp)" marker-start="url(#arr-mcp)"/>
  <rect x="372" y="155" width="136" height="46" rx="8" fill="#e0edff" stroke="#1e71d6"/>
  <text x="440" y="176" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">JSON-RPC 2.0</text>
  <text x="440" y="193" text-anchor="middle" fill="#1e71d6" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">stdio | HTTP/SSE</text>

  <!-- Right: MCP Server and 3 Primitives -->
  <rect x="535" y="80" width="630" height="310" rx="16" fill="#ffffff" stroke="#1e71d6" stroke-width="3"/>
  <rect x="535" y="80" width="630" height="48" rx="16" fill="#1e71d6"/>
  <text x="850" y="110" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="700">MCP Server (Reusable Across Multiple Claude Apps)</text>

  <!-- Primitive 1: Tools -->
  <rect x="558" y="148" width="185" height="215" rx="12" fill="#f8fafc" stroke="#1e71d6" stroke-width="2"/>
  <text x="650" y="180" text-anchor="middle" fill="#1e71d6" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700">1. Tools</text>
  <text x="650" y="204" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">(Model-Controlled)</text>
  <text x="650" y="236" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="13">Executable functions</text>
  <text x="650" y="256" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="13">with JSON Schema</text>
  <text x="650" y="276" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="13">inputs and isError</text>
  <text x="650" y="315" text-anchor="middle" fill="#1e71d6" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">e.g. reserve_inventory</text>

  <!-- Primitive 2: Resources -->
  <rect x="758" y="148" width="185" height="215" rx="12" fill="#f8fafc" stroke="#6a55e4" stroke-width="2"/>
  <text x="850" y="180" text-anchor="middle" fill="#6a55e4" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700">2. Resources</text>
  <text x="850" y="204" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">(App-Controlled)</text>
  <text x="850" y="236" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="13">Read-only URI data</text>
  <text x="850" y="256" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="13">catalogs, schemas,</text>
  <text x="850" y="276" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="13">and doc trees</text>
  <text x="850" y="315" text-anchor="middle" fill="#6a55e4" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">e.g. db://schema/items</text>

  <!-- Primitive 3: Prompts -->
  <rect x="958" y="148" width="185" height="215" rx="12" fill="#f8fafc" stroke="#16a34a" stroke-width="2"/>
  <text x="1050" y="180" text-anchor="middle" fill="#16a34a" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700">3. Prompts</text>
  <text x="1050" y="204" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">(User-Controlled)</text>
  <text x="1050" y="236" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="13">Pre-built workflow</text>
  <text x="1050" y="256" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="13">templates exposed</text>
  <text x="1050" y="276" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="13">as slash commands</text>
  <text x="1050" y="315" text-anchor="middle" fill="#16a34a" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">e.g. /audit-inventory</text>
</svg>
