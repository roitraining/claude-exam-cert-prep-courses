<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Prompt Caching Checkpoints and Token Accounting">
  <!-- Checkpoint 1: Tools -->
  <rect x="20" y="15" width="265" height="200" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="3"/>
  <text x="152" y="54" text-anchor="middle" fill="#166534" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">CHECKPOINT 1</text>
  <text x="152" y="88" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="700">Tool Definitions</text>
  <text x="152" y="120" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="15">Static MCP and custom</text>
  <text x="152" y="144" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="15">function JSON schemas</text>
  <rect x="42" y="164" width="220" height="34" rx="6" fill="#dcfce7"/>
  <text x="152" y="186" text-anchor="middle" fill="#166534" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">cache_control: ephemeral</text>

  <!-- Checkpoint 2: System Prompt -->
  <rect x="305" y="15" width="265" height="200" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="3"/>
  <text x="437" y="54" text-anchor="middle" fill="#166534" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">CHECKPOINT 2</text>
  <text x="437" y="88" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="700">System Instructions</text>
  <text x="437" y="120" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="15">Role, rules, and static</text>
  <text x="437" y="144" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="15">reference documentation</text>
  <rect x="327" y="164" width="220" height="34" rx="6" fill="#dcfce7"/>
  <text x="437" y="186" text-anchor="middle" fill="#166534" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">cache_control: ephemeral</text>

  <!-- Checkpoint 3: Multi-turn History Prefix -->
  <rect x="590" y="15" width="275" height="200" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="3"/>
  <text x="727" y="54" text-anchor="middle" fill="#166534" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">CHECKPOINT 3</text>
  <text x="727" y="88" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="700">Prior Turn History</text>
  <text x="727" y="120" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="15">Completed multi-turn messages</text>
  <text x="727" y="144" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="15">and large uploaded documents</text>
  <rect x="617" y="164" width="220" height="34" rx="6" fill="#dcfce7"/>
  <text x="727" y="186" text-anchor="middle" fill="#166534" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">cache_control: ephemeral</text>

  <!-- Uncached Delta -->
  <rect x="885" y="15" width="295" height="200" rx="14" fill="#e0edff" stroke="#1e71d6" stroke-width="3"/>
  <text x="1032" y="54" text-anchor="middle" fill="#1e3a8a" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">UNCACHED DELTA</text>
  <text x="1032" y="88" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="700">Latest User / Tool Turn</text>
  <text x="1032" y="120" text-anchor="middle" fill="#1e3a8a" font-family="Inter, system-ui, sans-serif" font-size="15">New user message or latest</text>
  <text x="1032" y="144" text-anchor="middle" fill="#1e3a8a" font-family="Inter, system-ui, sans-serif" font-size="15">tool_result + model output</text>
  <rect x="912" y="164" width="240" height="34" rx="6" fill="#ffffff"/>
  <text x="1032" y="186" text-anchor="middle" fill="#1e3a8a" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">Standard input/output tokens</text>

  <!-- Usage Accounting Bar -->
  <rect x="20" y="238" width="1160" height="84" rx="12" fill="#082445"/>
  <text x="600" y="272" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">Response usage Object Token Accounting</text>
  <text x="600" y="302" text-anchor="middle" fill="#9eb6d4" font-family="Inter, system-ui, sans-serif" font-size="16">Total Input = cache_read_input_tokens (90% cheaper!) + cache_creation_input_tokens + input_tokens (uncached tail)</text>
</svg>
