<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Server-Sent Events Streaming Sequence">
  <defs>
    <marker id="arr-sse" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e71d6"/>
    </marker>
  </defs>

  <rect x="15" y="15" width="1170" height="290" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="600" y="48" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="700">Server-Sent Events (SSE) Streaming Lifecycle (stream: true)</text>

  <!-- Event 1 -->
  <rect x="35" y="75" width="195" height="135" rx="12" fill="#e0edff" stroke="#1e71d6" stroke-width="2"/>
  <text x="132" y="108" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">message_start</text>
  <text x="132" y="136" text-anchor="middle" fill="#1e3a8a" font-family="Inter, system-ui, sans-serif" font-size="13">Initial Message shell</text>
  <text x="132" y="158" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="12">id, model, role,</text>
  <text x="132" y="178" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="12">input_tokens usage</text>

  <line x1="230" y1="142" x2="258" y2="142" stroke="#1e71d6" stroke-width="3" marker-end="url(#arr-sse)"/>

  <!-- Event 2 -->
  <rect x="265" y="75" width="215" height="135" rx="12" fill="#f3e8ff" stroke="#6a55e4" stroke-width="2"/>
  <text x="372" y="108" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">content_block_start</text>
  <text x="372" y="136" text-anchor="middle" fill="#581c87" font-family="Inter, system-ui, sans-serif" font-size="13">Opens block at index N</text>
  <text x="372" y="158" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="12">thinking | text | tool_use</text>
  <text x="372" y="178" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="12">(tool id + name)</text>

  <line x1="480" y1="142" x2="508" y2="142" stroke="#1e71d6" stroke-width="3" marker-end="url(#arr-sse)"/>

  <!-- Event 3 -->
  <rect x="515" y="75" width="235" height="135" rx="12" fill="#faf5ff" stroke="#6a55e4" stroke-width="3"/>
  <text x="632" y="108" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">content_block_delta*</text>
  <text x="632" y="134" text-anchor="middle" fill="#581c87" font-family="Inter, system-ui, sans-serif" font-size="13">Incremental token chunks</text>
  <text x="632" y="156" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="12">text_delta | thinking_delta</text>
  <text x="632" y="176" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="12">input_json_delta | signature_delta</text>
  <text x="632" y="196" text-anchor="middle" fill="#6a55e4" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700">Followed by content_block_stop</text>

  <line x1="750" y1="142" x2="778" y2="142" stroke="#1e71d6" stroke-width="3" marker-end="url(#arr-sse)"/>

  <!-- Event 4 -->
  <rect x="785" y="75" width="190" height="135" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="880" y="108" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">message_delta</text>
  <text x="880" y="136" text-anchor="middle" fill="#92400e" font-family="Inter, system-ui, sans-serif" font-size="13">Final stop metadata</text>
  <text x="880" y="158" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="12">stop_reason (end_turn,</text>
  <text x="880" y="178" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="12">tool_use, max_tokens)</text>

  <line x1="975" y1="142" x2="1003" y2="142" stroke="#1e71d6" stroke-width="3" marker-end="url(#arr-sse)"/>

  <!-- Event 5 -->
  <rect x="1010" y="75" width="155" height="135" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="1087" y="108" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">message_stop</text>
  <text x="1087" y="136" text-anchor="middle" fill="#047857" font-family="Inter, system-ui, sans-serif" font-size="13">Stream complete</text>
  <text x="1087" y="160" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="12">get_final_message()</text>
  <text x="1087" y="180" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="12">resolves cleanly</text>

  <!-- Bottom note -->
  <rect x="35" y="232" width="1130" height="52" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="600" y="264" text-anchor="middle" fill="#1e293b" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600">Resilience rule: if an SSE stream drops before message_stop, catch APIConnectionError on the client and resume or retry with an idempotency key.</text>
</svg>
