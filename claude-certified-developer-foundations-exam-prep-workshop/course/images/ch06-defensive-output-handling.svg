<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Defensive Output Handling and Validation Pipeline">
  <defs>
    <marker id="arr-o1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e71d6"/>
    </marker>
    <marker id="arr-o2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="1200" height="420" rx="18" fill="#f4f8fc" stroke="#dbe5f0" stroke-width="2"/>
  <text x="600" y="46" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="700">Defensive Output Handling: Never Trust Raw LLM Output Without Verification</text>

  <!-- Step 1: Constrained Generation -->
  <rect x="30" y="95" width="255" height="190" rx="14" fill="#082445"/>
  <text x="157" y="135" text-anchor="middle" fill="#9eb6d4" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">1. CONSTRAINED GENERATION</text>
  <text x="157" y="168" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">tool_use JSON Schema</text>
  <text x="157" y="202" text-anchor="middle" fill="#e2ecf7" font-family="Inter, system-ui, sans-serif" font-size="14">" Nullable optional fields</text>
  <text x="157" y="226" text-anchor="middle" fill="#e2ecf7" font-family="Inter, system-ui, sans-serif" font-size="14">" "unclear" enum fallback</text>
  <text x="157" y="250" text-anchor="middle" fill="#e2ecf7" font-family="Inter, system-ui, sans-serif" font-size="14">" Check stop_reason != max_tokens</text>

  <line x1="285" y1="190" x2="325" y2="190" stroke="#1e71d6" stroke-width="4" marker-end="url(#arr-o1)"/>

  <!-- Step 2: Defensive Parsing -->
  <rect x="335" y="95" width="255" height="190" rx="14" fill="#1e71d6"/>
  <text x="462" y="135" text-anchor="middle" fill="#bfdbfe" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">2. DEFENSIVE PARSING</text>
  <text x="462" y="168" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">Pydantic / Zod Validator</text>
  <text x="462" y="202" text-anchor="middle" fill="#eff6ff" font-family="Inter, system-ui, sans-serif" font-size="14">" Strict runtime type check</text>
  <text x="462" y="226" text-anchor="middle" fill="#eff6ff" font-family="Inter, system-ui, sans-serif" font-size="14">" Bounds and regex validation</text>
  <text x="462" y="250" text-anchor="middle" fill="#eff6ff" font-family="Inter, system-ui, sans-serif" font-size="14">" Catch ValidationError safely</text>

  <line x1="590" y1="190" x2="630" y2="190" stroke="#1e71d6" stroke-width="4" marker-end="url(#arr-o1)"/>

  <!-- Step 3: Semantic Skepticism -->
  <rect x="640" y="95" width="255" height="190" rx="14" fill="#ffffff" stroke="#1e71d6" stroke-width="3"/>
  <text x="767" y="135" text-anchor="middle" fill="#1e71d6" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">3. SEMANTIC VERIFICATION</text>
  <text x="767" y="168" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">Skepticism Checks</text>
  <text x="767" y="202" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="14">" Cross-field math check</text>
  <text x="767" y="226" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="14">" Source quote substring match</text>
  <text x="767" y="250" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="14">" SQL/HTML output escaping</text>

  <line x1="895" y1="190" x2="935" y2="190" stroke="#1e71d6" stroke-width="4" marker-end="url(#arr-o1)"/>

  <!-- Step 4: Safe Consumption -->
  <rect x="945" y="95" width="225" height="190" rx="14" fill="#ecfdf5" stroke="#16a34a" stroke-width="3"/>
  <text x="1057" y="135" text-anchor="middle" fill="#047857" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">4. SAFE CONSUMPTION</text>
  <text x="1057" y="168" text-anchor="middle" fill="#065f46" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">Downstream System</text>
  <text x="1057" y="202" text-anchor="middle" fill="#047857" font-family="Inter, system-ui, sans-serif" font-size="14">" Parameterized DB write</text>
  <text x="1057" y="226" text-anchor="middle" fill="#047857" font-family="Inter, system-ui, sans-serif" font-size="14">" Verified UI rendering</text>
  <text x="1057" y="250" text-anchor="middle" fill="#047857" font-family="Inter, system-ui, sans-serif" font-size="14">" HITL queue on conflict</text>

  <!-- Self-correction retry path -->
  <path d="M 767 285 V 360 H 157 V 295" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#arr-o2)"/>
  <rect x="310" y="330" width="520" height="50" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="570" y="361" text-anchor="middle" fill="#991b1b" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">On Validation Failure: Retry with Failed Output + Specific Error Message</text>
</svg>
