<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Defensive Output Handling and Validation Pipeline">
  <defs>
    <marker id="arr-o1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e71d6"/>
    </marker>
    <marker id="arr-o2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Step 1: Constrained Generation -->
  <rect x="20" y="20" width="260" height="195" rx="14" fill="#082445"/>
  <text x="150" y="60" text-anchor="middle" fill="#9eb6d4" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">1. CONSTRAINED GENERATION</text>
  <text x="150" y="94" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="700">tool_use JSON Schema</text>
  <text x="150" y="130" text-anchor="middle" fill="#e2ecf7" font-family="Inter, system-ui, sans-serif" font-size="15">• Nullable optional fields</text>
  <text x="150" y="156" text-anchor="middle" fill="#e2ecf7" font-family="Inter, system-ui, sans-serif" font-size="15">• "unclear" enum fallback</text>
  <text x="150" y="182" text-anchor="middle" fill="#e2ecf7" font-family="Inter, system-ui, sans-serif" font-size="14">• stop_reason != max_tokens</text>

  <line x1="280" y1="118" x2="320" y2="118" stroke="#1e71d6" stroke-width="4" marker-end="url(#arr-o1)"/>

  <!-- Step 2: Defensive Parsing -->
  <rect x="330" y="20" width="260" height="195" rx="14" fill="#1e71d6"/>
  <text x="460" y="60" text-anchor="middle" fill="#bfdbfe" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">2. DEFENSIVE PARSING</text>
  <text x="460" y="94" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="700">Pydantic / Zod Validator</text>
  <text x="460" y="130" text-anchor="middle" fill="#eff6ff" font-family="Inter, system-ui, sans-serif" font-size="15">• Strict runtime type check</text>
  <text x="460" y="156" text-anchor="middle" fill="#eff6ff" font-family="Inter, system-ui, sans-serif" font-size="15">• Bounds and regex checks</text>
  <text x="460" y="182" text-anchor="middle" fill="#eff6ff" font-family="Inter, system-ui, sans-serif" font-size="15">• Catch ValidationError safely</text>

  <line x1="590" y1="118" x2="630" y2="118" stroke="#1e71d6" stroke-width="4" marker-end="url(#arr-o1)"/>

  <!-- Step 3: Semantic Skepticism -->
  <rect x="640" y="20" width="260" height="195" rx="14" fill="#ffffff" stroke="#1e71d6" stroke-width="3"/>
  <text x="770" y="60" text-anchor="middle" fill="#1e71d6" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">3. SEMANTIC VERIFICATION</text>
  <text x="770" y="94" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="700">Skepticism Checks</text>
  <text x="770" y="130" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="15">• Cross-field math check</text>
  <text x="770" y="156" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="15">• Quote substring verification</text>
  <text x="770" y="182" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="15">• SQL/HTML output escaping</text>

  <line x1="900" y1="118" x2="940" y2="118" stroke="#1e71d6" stroke-width="4" marker-end="url(#arr-o1)"/>

  <!-- Step 4: Safe Consumption -->
  <rect x="950" y="20" width="230" height="195" rx="14" fill="#ecfdf5" stroke="#16a34a" stroke-width="3"/>
  <text x="1065" y="60" text-anchor="middle" fill="#047857" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">4. SAFE CONSUMPTION</text>
  <text x="1065" y="94" text-anchor="middle" fill="#065f46" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="700">Downstream System</text>
  <text x="1065" y="130" text-anchor="middle" fill="#047857" font-family="Inter, system-ui, sans-serif" font-size="15">• Parameterized DB write</text>
  <text x="1065" y="156" text-anchor="middle" fill="#047857" font-family="Inter, system-ui, sans-serif" font-size="15">• Verified UI rendering</text>
  <text x="1065" y="182" text-anchor="middle" fill="#047857" font-family="Inter, system-ui, sans-serif" font-size="15">• HITL queue on conflict</text>

  <!-- Self-correction retry path -->
  <path d="M 770 215 V 290 H 150 V 225" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#arr-o2)"/>
  <rect x="290" y="260" width="540" height="52" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="560" y="292" text-anchor="middle" fill="#991b1b" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">On Validation Failure: Retry with Failed Output + Specific Error Message</text>
</svg>
