<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Prompt Injection Defense Architecture">
  <!-- Left: Ineffective Traps -->
  <rect x="20" y="15" width="510" height="310" rx="16" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
  <rect x="20" y="15" width="510" height="48" rx="16" fill="#dc2626"/>
  <text x="275" y="46" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="700">Ineffective Mitigations (Exam Traps)</text>

  <text x="50" y="102" fill="#991b1b" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700">• Raising model temperature:</text>
  <text x="70" y="126" fill="#7f1d1d" font-family="Inter, system-ui, sans-serif" font-size="15">Randomness does not stop instruction hijacking.</text>

  <text x="50" y="166" fill="#991b1b" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700">• Polite system prompt warning:</text>
  <text x="70" y="190" fill="#7f1d1d" font-family="Inter, system-ui, sans-serif" font-size="15">“Please do not include malicious text” is not enforceable.</text>

  <text x="50" y="230" fill="#991b1b" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700">• Switching to a larger model alone:</text>
  <text x="70" y="254" fill="#7f1d1d" font-family="Inter, system-ui, sans-serif" font-size="15">Stronger instruction-following can follow injected text too</text>
  <text x="70" y="276" fill="#7f1d1d" font-family="Inter, system-ui, sans-serif" font-size="15">if trust boundaries and tool hooks are missing.</text>

  <!-- Right: Effective Defense Architecture -->
  <rect x="555" y="15" width="625" height="310" rx="16" fill="#ecfdf5" stroke="#16a34a" stroke-width="3"/>
  <rect x="555" y="15" width="625" height="48" rx="16" fill="#16a34a"/>
  <text x="867" y="46" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="700">Effective Defense-in-Depth Mitigation (Exam Standard)</text>

  <rect x="585" y="82" width="565" height="66" rx="10" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
  <text x="867" y="110" text-anchor="middle" fill="#065f46" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700">1. Isolate Untrusted Input from Trusted Instructions</text>
  <text x="867" y="134" text-anchor="middle" fill="#047857" font-family="Inter, system-ui, sans-serif" font-size="15">Wrap external web/doc text in &lt;untrusted_content&gt; XML tags</text>

  <rect x="585" y="160" width="565" height="66" rx="10" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
  <text x="867" y="188" text-anchor="middle" fill="#065f46" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700">2. Enforce Least-Privilege Tool Scoping</text>
  <text x="867" y="212" text-anchor="middle" fill="#047857" font-family="Inter, system-ui, sans-serif" font-size="15">A page summarizer should have zero sensitive write/delete tools</text>

  <rect x="585" y="238" width="565" height="66" rx="10" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
  <text x="867" y="266" text-anchor="middle" fill="#065f46" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700">3. Deterministic Guardrails and PreToolUse Hooks</text>
  <text x="867" y="290" text-anchor="middle" fill="#047857" font-family="Inter, system-ui, sans-serif" font-size="15">Block sensitive tool invocations and scan outputs for leaks</text>
</svg>
