<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Agent Security Threat Model Trifecta and Architectural Mitigations">
  <!-- Left: Threat Trifecta -->
  <rect x="20" y="15" width="560" height="310" rx="16" fill="#ffffff" stroke="#dc2626" stroke-width="3"/>
  <rect x="20" y="15" width="560" height="48" rx="16" fill="#dc2626"/>
  <text x="300" y="46" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">Unmitigated Agent Risk: The Three-Legged Attack Surface</text>

  <rect x="45" y="84" width="240" height="78" rx="10" fill="#fef2f2" stroke="#f87171" stroke-width="2"/>
  <text x="165" y="114" text-anchor="middle" fill="#7f1d1d" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">1. Untrusted External Input</text>
  <text x="165" y="138" text-anchor="middle" fill="#991b1b" font-family="Inter, system-ui, sans-serif" font-size="13">Web pages, tickets, PR diffs</text>

  <rect x="315" y="84" width="240" height="78" rx="10" fill="#fef2f2" stroke="#f87171" stroke-width="2"/>
  <text x="435" y="114" text-anchor="middle" fill="#7f1d1d" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">2. Private Sensitive Data</text>
  <text x="435" y="138" text-anchor="middle" fill="#991b1b" font-family="Inter, system-ui, sans-serif" font-size="13">Customer DB, secrets, PII</text>

  <rect x="150" y="182" width="300" height="78" rx="10" fill="#fef2f2" stroke="#f87171" stroke-width="2"/>
  <text x="300" y="212" text-anchor="middle" fill="#7f1d1d" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">3. Unchecked Outbound Action</text>
  <text x="300" y="236" text-anchor="middle" fill="#991b1b" font-family="Inter, system-ui, sans-serif" font-size="13">send_email, curl, delete_records</text>

  <text x="300" y="294" text-anchor="middle" fill="#b91c1c" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">When all 3 combine, injected text can exfiltrate or destroy data</text>

  <!-- Right: Architectural Controls -->
  <rect x="620" y="15" width="560" height="310" rx="16" fill="#ffffff" stroke="#16a34a" stroke-width="3"/>
  <rect x="620" y="15" width="560" height="48" rx="16" fill="#16a34a"/>
  <text x="900" y="46" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">Defense-in-Depth: Breaking the Attack Chain</text>

  <rect x="648" y="82" width="504" height="62" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="666" y="108" fill="#065f46" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">Isolate Untrusted Data (Input Boundary)</text>
  <text x="666" y="130" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="13">Escape and wrap external content in XML tags; keep separate from system prompt</text>

  <rect x="648" y="158" width="504" height="62" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="666" y="184" fill="#065f46" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">Least-Privilege Tool Scoping + User Auth</text>
  <text x="666" y="206" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="13">Summarizers get 0 write tools; propagate caller OIDC permissions per tool call</text>

  <rect x="648" y="234" width="504" height="68" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="666" y="260" fill="#065f46" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">Deterministic Hooks + Human Approval Gates</text>
  <text x="666" y="282" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="13">PreToolUse blocks/asks on sensitive actions; container sandbox + settings.json deny</text>
</svg>
