<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="CCDV-F Exam Domain Weights">
  <defs>
    <linearGradient id="dv1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e71d6"/>
      <stop offset="1" stop-color="#3d62e4"/>
    </linearGradient>
    <linearGradient id="dv2" x1="0" y1="0" x2="1" y2="0">
