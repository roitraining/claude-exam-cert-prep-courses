<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Isolating Integration Layer Bugs from Model Output Failures via Trace Analysis">
  <!-- Left: Integration Layer Failure -->
  <rect x="20" y="15" width="560" height="310" rx="16" fill="#ffffff" stroke="#1e71d6" stroke-width="3"/>
  <rect x="20" y="15" width="560" height="48" rx="16" fill="#1e71d6"/>
  <text x="300" y="46" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="700">1. Integration Layer Origins (Code / Harness Bug)</text>

  <text x="50" y="96" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700">What the Execution Trace Shows:</text>
  <text x="50" y="126" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="15">• Tool returned empty/stale data or HTTP 500 swallowed as []</text>
  <text x="50" y="152" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="15">• History array dropped prior assistant/tool_result turns</text>
  <text x="50" y="178" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="15">• stop_reason == "max_tokens" truncated JSON mid-object</text>
  <text x="50" y="204" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="15">• Wrong variable interpolated into prompt template</text>

  <rect x="50" y="226" width="500" height="78" rx="10" fill="#e0edff" stroke="#93c5fd"/>
  <text x="300" y="256" text-anchor="middle" fill="#1e3a8a" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700">Fix in Application Code:</text>
  <text x="300" y="282" text-anchor="middle" fill="#1e3a8a" font-family="Inter, system-ui, sans-serif" font-size="14">Fix parser, raise max_tokens, pass full messages[], return isError</text>

  <!-- Right: Model Output Failure -->
  <rect x="620" y="15" width="560" height="310" rx="16" fill="#ffffff" stroke="#6a55e4" stroke-width="3"/>
  <rect x="620" y="15" width="560" height="48" rx="16" fill="#6a55e4"/>
  <text x="900" y="46" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="700">2. Model Output Origins (Prompt / Schema / Tier)</text>

  <text x="650" y="96" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700">What the Execution Trace Shows:</text>
  <text x="650" y="126" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="15">• Prompt and tool_result payload are complete and accurate</text>
  <text x="650" y="152" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="15">• Model picks the wrong tool between two vague descriptions</text>
  <text x="650" y="178" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="15">• Model fabricates a required field when source data is absent</text>
  <text x="650" y="204" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="15">• Model misses subtle multi-hop logic on a small tier</text>

  <rect x="650" y="226" width="500" height="78" rx="10" fill="#f3e8ff" stroke="#d8b4fe"/>
  <text x="900" y="256" text-anchor="middle" fill="#581c87" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700">Fix in Prompt / Schema / Model Config:</text>
  <text x="900" y="282" text-anchor="middle" fill="#581c87" font-family="Inter, system-ui, sans-serif" font-size="14">Expand tool descriptions, make fields nullable, add few-shots/thinking</text>
</svg>
