<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Isolating Integration Layer Bugs from Model Output Failures via Trace Analysis">
  <rect width="1200" height="420" rx="18" fill="#f4f8fc" stroke="#dbe5f0" stroke-width="2"/>
  <text x="600" y="48" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="700">Trace Analysis: Isolating Integration-Layer Bugs vs Model Output Failures</text>

  <!-- Left: Integration Layer Failure -->
  <rect x="35" y="80" width="540" height="305" rx="16" fill="#ffffff" stroke="#1e71d6" stroke-width="3"/>
  <rect x="35" y="80" width="540" height="48" rx="16" fill="#1e71d6"/>
  <text x="305" y="110" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="700">1. Integration Layer Origins (Code / Harness Bug)</text>

  <text x="65" y="162" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">What the Execution Trace Shows:</text>
  <text x="65" y="190" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="14">" Tool returned empty/stale data or HTTP 500 swallowed as []</text>
  <text x="65" y="214" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="14">" History array dropped prior assistant/tool_result turns</text>
  <text x="65" y="238" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="14">" stop_reason == "max_tokens" truncated JSON mid-object</text>
  <text x="65" y="262" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="14">" Wrong variable interpolated into prompt template</text>

  <rect x="65" y="285" width="480" height="75" rx="10" fill="#e0edff"/>
  <text x="305" y="314" text-anchor="middle" fill="#1e3a8a" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">Fix in Application Code:</text>
  <text x="305" y="338" text-anchor="middle" fill="#1e3a8a" font-family="Inter, system-ui, sans-serif" font-size="14">Fix parser, raise max_tokens, pass full messages[], return isError</text>

  <!-- Right: Model Output Failure -->
  <rect x="625" y="80" width="540" height="305" rx="16" fill="#ffffff" stroke="#6a55e4" stroke-width="3"/>
  <rect x="625" y="80" width="540" height="48" rx="16" fill="#6a55e4"/>
  <text x="895" y="110" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="700">2. Model Output Origins (Prompt / Schema / Tier)</text>

  <text x="655" y="162" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">What the Execution Trace Shows:</text>
  <text x="655" y="190" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="14">" Prompt and tool_result payload are complete and accurate</text>
  <text x="655" y="214" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="14">" Model picks the wrong tool between two vague descriptions</text>
  <text x="655" y="238" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="14">" Model fabricates a required field when source data is absent</text>
  <text x="655" y="262" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="14">" Model misses subtle multi-hop logic on a small tier</text>

  <rect x="655" y="285" width="480" height="75" rx="10" fill="#f3e8ff"/>
  <text x="895" y="314" text-anchor="middle" fill="#581c87" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">Fix in Prompt / Schema / Model Config:</text>
  <text x="895" y="338" text-anchor="middle" fill="#581c87" font-family="Inter, system-ui, sans-serif" font-size="14">Expand tool descriptions, make fields nullable, add few-shots/thinking</text>
</svg>
