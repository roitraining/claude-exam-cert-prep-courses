  <text x="550" y="118" text-anchor="middle" fill="#065f46" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">CLAUDE.md + .claude/rules/</text>
  <text x="550" y="140" text-anchor="middle" fill="#047857" font-family="Inter, system-ui, sans-serif" font-size="13">Shared memory + path globs</text>
  <rect x="405" y="170" width="290" height="64" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="550" y="196" text-anchor="middle" fill="#991b1b" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">.claude/settings.json</text>
  <text x="550" y="218" text-anchor="middle" fill="#7f1d1d" font-family="Inter, system-ui, sans-serif" font-size="13">allow: npm test | deny: Read(.env*)</text>
  <rect x="405" y="248" width="290" height="62" rx="10" fill="#f3e8ff" stroke="#d8b4fe"/>
  <text x="550" y="274" text-anchor="middle" fill="#581c87" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">Skills + Headless Mode (-p)</text>
  <text x="550" y="296" text-anchor="middle" fill="#6b21a8" font-family="Inter, system-ui, sans-serif" font-size="13">context: fork | --json-schema</text>

  <!-- Panel 3: Trace Analysis & Isolation -->
  <rect x="745" y="25" width="335" height="310" rx="14" fill="#ffffff" stroke="#6a55e4" stroke-width="3"/>
  <rect x="745" y="25" width="335" height="48" rx="14" fill="#6a55e4"/>
  <text x="912" y="55" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">Task 3 and 4: Trace Debugging</text>
  <rect x="768" y="92" width="290" height="96" rx="10" fill="#f3e8ff" stroke="#d8b4fe"/>
  <text x="912" y="118" text-anchor="middle" fill="#581c87" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">Integration-Layer Bugs</text>
  <text x="912" y="142" text-anchor="middle" fill="#6b21a8" font-family="Inter, system-ui, sans-serif" font-size="13">stop_reason == "max_tokens" truncation</text>
