<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" width="1100" height="360" role="img" aria-label="Lab 1: manual agent loop, subagent delegation, and Agent SDK hook">
  <rect x="20" y="25" width="335" height="310" rx="14" fill="#ffffff" stroke="#1e71d6" stroke-width="3"/>
  <rect x="20" y="25" width="335" height="48" rx="14" fill="#1e71d6"/>
  <text x="187" y="55" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700">Task 1: Fix the Agent Loop</text>
  <rect x="42" y="92" width="290" height="100" rx="10" fill="#e0edff"/>
  <text x="187" y="119" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">Branch on stop_reason</text>
  <text x="187" y="144" text-anchor="middle" fill="#1e3a8a" font-family="Inter, system-ui, sans-serif" font-size="13">tool_use -&gt; run tools, send results</text>
  <text x="187" y="166" text-anchor="middle" fill="#1e3a8a" font-family="Inter, system-ui, sans-serif" font-size="13">end_turn -&gt; return the answer</text>
  <rect x="42" y="208" width="290" height="100" rx="10" fill="#e0edff"/>
  <text x="187" y="235" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">Never loop forever</text>
  <text x="187" y="260" text-anchor="middle" fill="#1e3a8a" font-family="Inter, system-ui, sans-serif" font-size="13">Keep every assistant turn</text>
  <text x="187" y="282" text-anchor="middle" fill="#1e3a8a" font-family="Inter, system-ui, sans-serif" font-size="13">Cap turns; stop on max_tokens</text>
  <rect x="382" y="25" width="335" height="310" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="3"/>
  <rect x="382" y="25" width="335" height="48" rx="14" fill="#16a34a"/>
  <text x="549" y="55" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700">Task 2: Delegate to a Subagent</text>
  <rect x="404" y="92" width="290" height="100" rx="10" fill="#f0fdf4"/>
  <text x="549" y="119" text-anchor="middle" fill="#065f46" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">log-investigator</text>
  <text x="549" y="144" text-anchor="middle" fill="#047857" font-family="Inter, system-ui, sans-serif" font-size="13">Own context window</text>
  <text x="549" y="166" text-anchor="middle" fill="#047857" font-family="Inter, system-ui, sans-serif" font-size="13">Read, Grep, Glob only</text>
  <rect x="404" y="208" width="290" height="100" rx="10" fill="#f0fdf4"/>
  <text x="549" y="235" text-anchor="middle" fill="#065f46" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">Main agent</text>
  <text x="549" y="260" text-anchor="middle" fill="#047857" font-family="Inter, system-ui, sans-serif" font-size="13">Passes the task explicitly</text>
  <text x="549" y="282" text-anchor="middle" fill="#047857" font-family="Inter, system-ui, sans-serif" font-size="13">Gets back a short summary</text>
  <rect x="744" y="25" width="335" height="310" rx="14" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/>
  <rect x="744" y="25" width="335" height="48" rx="14" fill="#7c3aed"/>
  <text x="911" y="55" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700">Task 3: Agent SDK Hook</text>
  <rect x="766" y="92" width="290" height="100" rx="10" fill="#f5f3ff"/>
  <text x="911" y="119" text-anchor="middle" fill="#4c1d95" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">query() + ClaudeAgentOptions</text>
  <text x="911" y="144" text-anchor="middle" fill="#6d28d9" font-family="Inter, system-ui, sans-serif" font-size="13">Claude Code harness as a library</text>
  <text x="911" y="166" text-anchor="middle" fill="#6d28d9" font-family="Inter, system-ui, sans-serif" font-size="13">Model, tools, max_turns</text>
  <rect x="766" y="208" width="290" height="100" rx="10" fill="#f5f3ff"/>
  <text x="911" y="235" text-anchor="middle" fill="#4c1d95" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">PreToolUse hook</text>
  <text x="911" y="260" text-anchor="middle" fill="#6d28d9" font-family="Inter, system-ui, sans-serif" font-size="13">Denies rm in code, every time</text>
  <text x="911" y="282" text-anchor="middle" fill="#6d28d9" font-family="Inter, system-ui, sans-serif" font-size="13">Prompts can be ignored; hooks not</text>
</svg>
