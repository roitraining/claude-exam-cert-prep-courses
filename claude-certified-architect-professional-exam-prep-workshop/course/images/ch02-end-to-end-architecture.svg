<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="1200" height="350" role="img" aria-label="End-to-End Enterprise Claude Architecture Pipeline">
  <defs>
    <marker id="arr-e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e71d6"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6a55e4"/>
    </marker>
  </defs>

  <!-- Stage 1: Input Gateway -->
  <rect x="20" y="20" width="250" height="190" rx="14" fill="#082445"/>
  <text x="145" y="60" text-anchor="middle" fill="#9eb6d4" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">1. INPUT GATEWAY</text>
  <text x="145" y="94" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700">Auth and Ingestion</text>
  <text x="145" y="130" text-anchor="middle" fill="#e2ecf7" font-family="Inter, system-ui, sans-serif" font-size="15">• IAM / OAuth verification</text>
  <text x="145" y="156" text-anchor="middle" fill="#e2ecf7" font-family="Inter, system-ui, sans-serif" font-size="15">• PII redaction / sanitization</text>
  <text x="145" y="182" text-anchor="middle" fill="#e2ecf7" font-family="Inter, system-ui, sans-serif" font-size="15">• Intent classification</text>

  <line x1="270" y1="115" x2="315" y2="115" stroke="#1e71d6" stroke-width="4" marker-end="url(#arr-e)"/>

  <!-- Stage 2: Context and Orchestration -->
  <rect x="325" y="20" width="255" height="190" rx="14" fill="#1e71d6"/>
  <text x="452" y="60" text-anchor="middle" fill="#bfdbfe" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">2. PROCESSING CORE</text>
  <text x="452" y="94" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700">Claude + Orchestration</text>
  <text x="452" y="130" text-anchor="middle" fill="#eff6ff" font-family="Inter, system-ui, sans-serif" font-size="15">• Cached system prefixes</text>
  <text x="452" y="156" text-anchor="middle" fill="#eff6ff" font-family="Inter, system-ui, sans-serif" font-size="15">• RAG / MCP tool execution</text>
  <text x="452" y="182" text-anchor="middle" fill="#eff6ff" font-family="Inter, system-ui, sans-serif" font-size="15">• Deterministic SDK hooks</text>

  <line x1="580" y1="115" x2="625" y2="115" stroke="#1e71d6" stroke-width="4" marker-end="url(#arr-e)"/>

  <!-- Stage 3: Output Validation -->
  <rect x="635" y="20" width="250" height="190" rx="14" fill="#ffffff" stroke="#1e71d6" stroke-width="3"/>
  <text x="760" y="60" text-anchor="middle" fill="#1e71d6" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">3. OUTPUT GATE</text>
  <text x="760" y="94" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700">Validation and HITL</text>
  <text x="760" y="130" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="15">• Schema / policy verification</text>
  <text x="760" y="156" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="15">• Citation grounding check</text>
  <text x="760" y="182" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="15">• Low-confidence HITL route</text>

  <line x1="885" y1="115" x2="930" y2="115" stroke="#1e71d6" stroke-width="4" marker-end="url(#arr-e)"/>

  <!-- Stage 4: Delivery -->
  <rect x="940" y="20" width="240" height="190" rx="14" fill="#ecfdf5" stroke="#16a34a" stroke-width="3"/>
  <text x="1060" y="60" text-anchor="middle" fill="#047857" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">4. DELIVERY</text>
  <text x="1060" y="94" text-anchor="middle" fill="#065f46" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700">Downstream Action</text>
  <text x="1060" y="130" text-anchor="middle" fill="#047857" font-family="Inter, system-ui, sans-serif" font-size="15">• User / API response</text>
  <text x="1060" y="156" text-anchor="middle" fill="#047857" font-family="Inter, system-ui, sans-serif" font-size="15">• Audit log emission</text>
  <text x="1060" y="182" text-anchor="middle" fill="#047857" font-family="Inter, system-ui, sans-serif" font-size="15">• SLA telemetry capture</text>

  <!-- Feedback Loop Bar -->
  <path d="M 1060 210 V 295 H 145 V 220" fill="none" stroke="#6a55e4" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arr-p)"/>
  <rect x="310" y="260" width="580" height="64" rx="10" fill="#f3e8ff" stroke="#6a55e4" stroke-width="2"/>
  <text x="600" y="288" text-anchor="middle" fill="#581c87" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700">Continuous Feedback Loop</text>
  <text x="600" y="312" text-anchor="middle" fill="#6b21a8" font-family="Inter, system-ui, sans-serif" font-size="15">Eval dataset curation, prompt/index refinement, and drift monitoring</text>
</svg>
