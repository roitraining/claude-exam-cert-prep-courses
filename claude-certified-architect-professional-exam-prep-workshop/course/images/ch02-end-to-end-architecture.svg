<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="End-to-End Enterprise Claude Architecture Pipeline">
  <defs>
    <marker id="arr-e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e71d6"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6a55e4"/>
    </marker>
  </defs>

  <rect width="1200" height="420" rx="18" fill="#f4f8fc" stroke="#dbe5f0" stroke-width="2"/>
  <text x="600" y="48" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="700">End-to-End Enterprise Claude Architecture (Input -&gt; Processing -&gt; Output -&gt; Feedback)</text>

  <!-- Stage 1: Input Gateway -->
  <rect x="35" y="100" width="240" height="165" rx="14" fill="#082445"/>
  <text x="155" y="140" text-anchor="middle" fill="#9eb6d4" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">1. INPUT GATEWAY</text>
  <text x="155" y="172" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="700">Auth and Ingestion</text>
  <text x="155" y="205" text-anchor="middle" fill="#e2ecf7" font-family="Inter, system-ui, sans-serif" font-size="14">" IAM / OAuth verification</text>
  <text x="155" y="228" text-anchor="middle" fill="#e2ecf7" font-family="Inter, system-ui, sans-serif" font-size="14">" PII redaction / sanitization</text>
  <text x="155" y="251" text-anchor="middle" fill="#e2ecf7" font-family="Inter, system-ui, sans-serif" font-size="14">" Intent classification</text>

  <line x1="275" y1="182" x2="325" y2="182" stroke="#1e71d6" stroke-width="4" marker-end="url(#arr-e)"/>

  <!-- Stage 2: Context and Orchestration -->
  <rect x="335" y="100" width="250" height="165" rx="14" fill="#1e71d6"/>
  <text x="460" y="140" text-anchor="middle" fill="#bfdbfe" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">2. PROCESSING CORE</text>
  <text x="460" y="172" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="700">Claude + Orchestration</text>
  <text x="460" y="205" text-anchor="middle" fill="#eff6ff" font-family="Inter, system-ui, sans-serif" font-size="14">" Cached system prefixes</text>
  <text x="460" y="228" text-anchor="middle" fill="#eff6ff" font-family="Inter, system-ui, sans-serif" font-size="14">" RAG / MCP tool execution</text>
  <text x="460" y="251" text-anchor="middle" fill="#eff6ff" font-family="Inter, system-ui, sans-serif" font-size="14">" Deterministic SDK hooks</text>

  <line x1="585" y1="182" x2="635" y2="182" stroke="#1e71d6" stroke-width="4" marker-end="url(#arr-e)"/>

  <!-- Stage 3: Output Validation -->
  <rect x="645" y="100" width="240" height="165" rx="14" fill="#ffffff" stroke="#1e71d6" stroke-width="3"/>
  <text x="765" y="140" text-anchor="middle" fill="#1e71d6" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">3. OUTPUT GATE</text>
  <text x="765" y="172" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="700">Validation and HITL</text>
  <text x="765" y="205" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="14">" Schema / policy verification</text>
  <text x="765" y="228" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="14">" Citation grounding check</text>
  <text x="765" y="251" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="14">" Low-confidence HITL route</text>

  <line x1="885" y1="182" x2="935" y2="182" stroke="#1e71d6" stroke-width="4" marker-end="url(#arr-e)"/>

  <!-- Stage 4: Delivery -->
  <rect x="945" y="100" width="220" height="165" rx="14" fill="#ecfdf5" stroke="#16a34a" stroke-width="3"/>
  <text x="1055" y="140" text-anchor="middle" fill="#047857" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">4. DELIVERY</text>
  <text x="1055" y="172" text-anchor="middle" fill="#065f46" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="700">Downstream Action</text>
  <text x="1055" y="205" text-anchor="middle" fill="#047857" font-family="Inter, system-ui, sans-serif" font-size="14">" User / API response</text>
  <text x="1055" y="228" text-anchor="middle" fill="#047857" font-family="Inter, system-ui, sans-serif" font-size="14">" Audit log emission</text>
  <text x="1055" y="251" text-anchor="middle" fill="#047857" font-family="Inter, system-ui, sans-serif" font-size="14">" SLA telemetry capture</text>

  <!-- Feedback Loop Bar -->
  <path d="M 1055 265 V 355 H 155 V 275" fill="none" stroke="#6a55e4" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arr-p)"/>
  <rect x="330" y="325" width="540" height="58" rx="10" fill="#f3e8ff" stroke="#6a55e4" stroke-width="2"/>
  <text x="600" y="350" text-anchor="middle" fill="#581c87" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700">Continuous Feedback Loop</text>
  <text x="600" y="372" text-anchor="middle" fill="#6b21a8" font-family="Inter, system-ui, sans-serif" font-size="14">Eval dataset curation, prompt/index refinement, and drift monitoring</text>
</svg>
