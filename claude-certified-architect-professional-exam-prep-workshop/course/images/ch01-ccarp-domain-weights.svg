  <rect x="610" y="384" width="470" height="32" rx="7" fill="#e2ecf7"/>
  <rect x="610" y="384" width="165" height="32" rx="7" fill="url(#p3)"/>
  <text x="1100" y="408" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="700">7%</text>
