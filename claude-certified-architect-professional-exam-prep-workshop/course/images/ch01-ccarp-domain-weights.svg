<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="CCAR-P Exam Domain Weights">
  <defs>
    <linearGradient id="p1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e71d6"/>
      <stop offset="1" stop-color="#3d62e4"/>
    </linearGradient>
    <linearGradient id="p2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4e5ce4"/>
      <stop offset="1" stop-color="#754fe0"/>
    </linearGradient>
    <linearGradient id="p3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c47d9"/>
      <stop offset="1" stop-color="#bd35c2"/>
    </linearGradient>
  </defs>

  <!-- D1: 17% -->
  <text x="24" y="48" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700">Domain 1: Solution Design and Architecture</text>
  <rect x="610" y="24" width="470" height="32" rx="7" fill="#e2ecf7"/>
  <rect x="610" y="24" width="400" height="32" rx="7" fill="url(#p1)"/>
  <text x="1100" y="48" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="700">17%</text>

  <!-- D2: 13% -->
  <text x="24" y="108" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700">Domain 2: Claude Models, Prompting, and Context</text>
  <rect x="610" y="84" width="470" height="32" rx="7" fill="#e2ecf7"/>
  <rect x="610" y="84" width="305" height="32" rx="7" fill="url(#p1)"/>
  <text x="1100" y="108" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="700">13%</text>

  <!-- D3: 19% -->
  <text x="24" y="168" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700">Domain 3: Integration (RAG, MCP, Security, Latency)</text>
  <rect x="610" y="144" width="470" height="32" rx="7" fill="#e2ecf7"/>
  <rect x="610" y="144" width="446" height="32" rx="7" fill="url(#p2)"/>
  <text x="1100" y="168" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="700">19%</text>

  <!-- D4: 16% -->
  <text x="24" y="228" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700">Domain 4: Evaluation, Testing, and Optimization</text>
  <rect x="610" y="204" width="470" height="32" rx="7" fill="#e2ecf7"/>
  <rect x="610" y="204" width="376" height="32" rx="7" fill="url(#p2)"/>
  <text x="1100" y="228" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="700">16%</text>

  <!-- D5: 14% -->
  <text x="24" y="288" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700">Domain 5: Governance, Safety, and Risk Management</text>
  <rect x="610" y="264" width="470" height="32" rx="7" fill="#e2ecf7"/>
  <rect x="610" y="264" width="329" height="32" rx="7" fill="url(#p3)"/>
  <text x="1100" y="288" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="700">14%</text>

  <!-- D6: 14% -->
  <text x="24" y="348" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700">Domain 6: Stakeholder Communication and Lifecycle</text>
  <rect x="610" y="324" width="470" height="32" rx="7" fill="#e2ecf7"/>
  <rect x="610" y="324" width="329" height="32" rx="7" fill="url(#p3)"/>
  <text x="1100" y="348" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="700">14%</text>

  <!-- D7: 7% -->
