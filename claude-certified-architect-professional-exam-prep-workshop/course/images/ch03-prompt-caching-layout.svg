<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="1200" height="350" role="img" aria-label="Prompt Caching Prefix Ordering Architecture">
  <!-- Cached Region Container -->
  <rect x="20" y="15" width="855" height="250" rx="16" fill="#ecfdf5" stroke="#16a34a" stroke-width="3" stroke-dasharray="10 5"/>
  <text x="447" y="48" text-anchor="middle" fill="#065f46" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">CACHED PREFIX (Reused Across Requests -&gt; Cuts TTFT Latency and Input Cost)</text>

  <!-- Block 1: Tools -->
  <rect x="40" y="68" width="250" height="175" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="165" y="106" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">1. Tool Definitions</text>
  <text x="165" y="138" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="15">MCP and function schemas</text>
  <text x="165" y="162" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="14">(Keep tool order deterministic)</text>
  <rect x="60" y="190" width="210" height="34" rx="6" fill="#dcfce7"/>
  <text x="165" y="212" text-anchor="middle" fill="#166534" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">cache_control: ephemeral</text>

  <!-- Block 2: System Prompt + Policy -->
  <rect x="310" y="68" width="280" height="175" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="450" y="106" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">2. System + Static Policy</text>
  <text x="450" y="138" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="15">8,000-token enterprise policy</text>
  <text x="450" y="162" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="15">and role instructions</text>
  <rect x="345" y="190" width="210" height="34" rx="6" fill="#dcfce7"/>
  <text x="450" y="212" text-anchor="middle" fill="#166534" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">cache_control: ephemeral</text>

  <!-- Block 3: Few-Shot Examples -->
  <rect x="610" y="68" width="245" height="175" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="732" y="106" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">3. Static Few-Shots</text>
  <text x="732" y="138" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="15">Canonical input/output</text>
  <text x="732" y="162" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="15">demonstration examples</text>
  <rect x="627" y="190" width="210" height="34" rx="6" fill="#dcfce7"/>
  <text x="732" y="212" text-anchor="middle" fill="#166534" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">cache_control: ephemeral</text>

  <!-- Dynamic Region -->
  <rect x="895" y="15" width="285" height="250" rx="16" fill="#e0edff" stroke="#1e71d6" stroke-width="3"/>
  <text x="1037" y="48" text-anchor="middle" fill="#1e3a8a" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">DYNAMIC SUFFIX</text>
  <rect x="915" y="68" width="245" height="175" rx="12" fill="#ffffff" stroke="#1e71d6" stroke-width="2"/>
  <text x="1037" y="106" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">4. Varying User Turn</text>
  <text x="1037" y="138" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="15">Per-request user query</text>
  <text x="1037" y="162" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="15">and live tool results</text>
  <text x="1037" y="212" text-anchor="middle" fill="#1e71d6" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">Processed Incremental Only</text>

  <!-- Warning Footer -->
  <rect x="20" y="282" width="1160" height="52" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="600" y="314" text-anchor="middle" fill="#991b1b" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700">Exam Rule: Injecting a changing timestamp or user ID at the start of the system prompt invalidates the entire downstream cache!</text>
</svg>
