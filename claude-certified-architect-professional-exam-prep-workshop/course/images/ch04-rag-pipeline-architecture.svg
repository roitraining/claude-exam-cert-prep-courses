<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Enterprise RAG Pipeline with Contextual Retrieval and Hybrid Search">
  <defs>
    <marker id="arr-r1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e71d6"/>
    </marker>
  </defs>

  <rect width="1200" height="420" rx="18" fill="#f4f8fc" stroke="#dbe5f0" stroke-width="2"/>
  <text x="600" y="46" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="700">Enterprise RAG Pipeline: Structure-Aware Chunking, Hybrid Retrieval, and Reranking</text>

  <!-- Step 1: Chunking + Contextual Prefix -->
  <rect x="30" y="95" width="215" height="205" rx="14" fill="#082445"/>
  <text x="137" y="135" text-anchor="middle" fill="#9eb6d4" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">1. INGEST AND CHUNK</text>
  <text x="137" y="168" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">Contextual Chunks</text>
  <text x="137" y="202" text-anchor="middle" fill="#e2ecf7" font-family="Inter, system-ui, sans-serif" font-size="14">" Semantic section boundaries</text>
  <text x="137" y="226" text-anchor="middle" fill="#e2ecf7" font-family="Inter, system-ui, sans-serif" font-size="14">" Prepend doc/section context</text>
  <text x="137" y="250" text-anchor="middle" fill="#e2ecf7" font-family="Inter, system-ui, sans-serif" font-size="14">" Attach ACL + date metadata</text>

  <line x1="245" y1="197" x2="290" y2="197" stroke="#1e71d6" stroke-width="4" marker-end="url(#arr-r1)"/>

  <!-- Step 2: Hybrid Index -->
  <rect x="300" y="95" width="225" height="205" rx="14" fill="#ffffff" stroke="#1e71d6" stroke-width="3"/>
  <text x="412" y="135" text-anchor="middle" fill="#1e71d6" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">2. HYBRID RETRIEVAL</text>
  <text x="412" y="168" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">Dense + Lexical</text>
  <text x="412" y="202" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="14">" Vector embeddings (semantic)</text>
  <text x="412" y="226" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="14">" BM25 / TF-IDF (exact SKUs)</text>
  <text x="412" y="250" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="14">" Pre-filter by tenant ACL</text>

  <line x1="525" y1="197" x2="570" y2="197" stroke="#1e71d6" stroke-width="4" marker-end="url(#arr-r1)"/>

  <!-- Step 3: Fusion + Reranker -->
  <rect x="580" y="95" width="215" height="205" rx="14" fill="#1e71d6"/>
  <text x="687" y="135" text-anchor="middle" fill="#bfdbfe" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">3. RERANKING</text>
  <text x="687" y="168" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">Precision Filter</text>
  <text x="687" y="202" text-anchor="middle" fill="#eff6ff" font-family="Inter, system-ui, sans-serif" font-size="14">" Reciprocal Rank Fusion</text>
  <text x="687" y="226" text-anchor="middle" fill="#eff6ff" font-family="Inter, system-ui, sans-serif" font-size="14">" Cross-encoder reranker</text>
  <text x="687" y="250" text-anchor="middle" fill="#eff6ff" font-family="Inter, system-ui, sans-serif" font-size="14">" Select top-K high-signal chunks</text>

  <line x1="795" y1="197" x2="840" y2="197" stroke="#1e71d6" stroke-width="4" marker-end="url(#arr-r1)"/>

  <!-- Step 4: Grounded Claude Generation -->
  <rect x="850" y="95" width="320" height="205" rx="14" fill="#ecfdf5" stroke="#16a34a" stroke-width="3"/>
  <text x="1010" y="135" text-anchor="middle" fill="#047857" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">4. GROUNDED GENERATION</text>
  <text x="1010" y="168" text-anchor="middle" fill="#065f46" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">Claude Synthesis + Citations</text>
  <text x="1010" y="202" text-anchor="middle" fill="#047857" font-family="Inter, system-ui, sans-serif" font-size="14">" XML-isolated &lt;retrieved_docs&gt;</text>
  <text x="1010" y="226" text-anchor="middle" fill="#047857" font-family="Inter, system-ui, sans-serif" font-size="14">" Source URL + date provenance</text>
  <text x="1010" y="250" text-anchor="middle" fill="#047857" font-family="Inter, system-ui, sans-serif" font-size="14">" Explicit abstention when absent</text>

  <!-- Bottom note -->
  <rect x="30" y="330" width="1140" height="54" rx="10" fill="#e0edff" stroke="#1e71d6" stroke-width="2"/>
  <text x="600" y="363" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700">Contextual Retrieval: Prepending document title, date, and section hierarchy to each chunk before embedding prevents orphan chunks.</text>
</svg>
