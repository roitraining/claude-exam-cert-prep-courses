<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="1200" height="350" role="img" aria-label="Enterprise RAG Pipeline with Contextual Retrieval and Hybrid Search">
  <defs>
    <marker id="arr-r1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e71d6"/>
    </marker>
  </defs>

  <!-- Step 1: Chunking + Contextual Prefix -->
  <rect x="20" y="20" width="235" height="230" rx="14" fill="#082445"/>
  <text x="137" y="62" text-anchor="middle" fill="#9eb6d4" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1.2">1. INGEST AND CHUNK</text>
  <text x="137" y="98" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="700">Contextual Chunks</text>
  <text x="137" y="138" text-anchor="middle" fill="#e2ecf7" font-family="Inter, system-ui, sans-serif" font-size="15">• Semantic section splits</text>
  <text x="137" y="166" text-anchor="middle" fill="#e2ecf7" font-family="Inter, system-ui, sans-serif" font-size="15">• Prepend doc context</text>
  <text x="137" y="194" text-anchor="middle" fill="#e2ecf7" font-family="Inter, system-ui, sans-serif" font-size="15">• Attach ACL + dates</text>

  <line x1="255" y1="135" x2="295" y2="135" stroke="#1e71d6" stroke-width="4" marker-end="url(#arr-r1)"/>

  <!-- Step 2: Hybrid Index -->
  <rect x="305" y="20" width="240" height="230" rx="14" fill="#ffffff" stroke="#1e71d6" stroke-width="3"/>
  <text x="425" y="62" text-anchor="middle" fill="#1e71d6" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1.2">2. HYBRID RETRIEVAL</text>
  <text x="425" y="98" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="700">Dense + Lexical</text>
  <text x="425" y="138" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="15">• Vector embeddings</text>
  <text x="425" y="166" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="15">• BM25 exact SKU/code</text>
  <text x="425" y="194" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="15">• Pre-filter by tenant ACL</text>

  <line x1="545" y1="135" x2="585" y2="135" stroke="#1e71d6" stroke-width="4" marker-end="url(#arr-r1)"/>

  <!-- Step 3: Fusion + Reranker -->
  <rect x="595" y="20" width="235" height="230" rx="14" fill="#1e71d6"/>
  <text x="712" y="62" text-anchor="middle" fill="#bfdbfe" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1.2">3. RERANKING</text>
  <text x="712" y="98" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="700">Precision Filter</text>
  <text x="712" y="138" text-anchor="middle" fill="#eff6ff" font-family="Inter, system-ui, sans-serif" font-size="15">• Reciprocal Rank Fusion</text>
  <text x="712" y="166" text-anchor="middle" fill="#eff6ff" font-family="Inter, system-ui, sans-serif" font-size="15">• Cross-encoder reranker</text>
  <text x="712" y="194" text-anchor="middle" fill="#eff6ff" font-family="Inter, system-ui, sans-serif" font-size="15">• Top-K high-signal chunks</text>

  <line x1="830" y1="135" x2="870" y2="135" stroke="#1e71d6" stroke-width="4" marker-end="url(#arr-r1)"/>

  <!-- Step 4: Grounded Claude Generation -->
  <rect x="880" y="20" width="300" height="230" rx="14" fill="#ecfdf5" stroke="#16a34a" stroke-width="3"/>
  <text x="1030" y="62" text-anchor="middle" fill="#047857" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1.2">4. GROUNDED GENERATION</text>
  <text x="1030" y="98" text-anchor="middle" fill="#065f46" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="700">Synthesis + Citations</text>
  <text x="1030" y="138" text-anchor="middle" fill="#047857" font-family="Inter, system-ui, sans-serif" font-size="15">• XML &lt;retrieved_docs&gt;</text>
  <text x="1030" y="166" text-anchor="middle" fill="#047857" font-family="Inter, system-ui, sans-serif" font-size="15">• Source URL + date provenance</text>
  <text x="1030" y="194" text-anchor="middle" fill="#047857" font-family="Inter, system-ui, sans-serif" font-size="15">• Explicit abstention if absent</text>

  <!-- Bottom note -->
  <rect x="20" y="275" width="1160" height="54" rx="10" fill="#e0edff" stroke="#1e71d6" stroke-width="2"/>
  <text x="600" y="308" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700">Contextual Retrieval: Prepending document title, date, and section hierarchy to each chunk before embedding prevents orphan chunks.</text>
</svg>
