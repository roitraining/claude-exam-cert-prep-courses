<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="Skills Progressive Disclosure: three loading levels">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Level 1 -->
  <rect x="20" y="20" width="350" height="250" rx="16" fill="#ecfdf5" stroke="#16a34a" stroke-width="3"/>
  <text x="195" y="58" text-anchor="middle" fill="#065f46" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700">Level 1: Metadata</text>
  <text x="195" y="92" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="16">name + description from</text>
  <text x="195" y="114" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="16">SKILL.md frontmatter</text>
  <rect x="55" y="140" width="280" height="40" rx="8" fill="#dcfce7"/>
  <text x="195" y="166" text-anchor="middle" fill="#166534" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700">Always in context</text>
  <text x="195" y="212" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="15">About 100 tokens per skill:</text>
  <text x="195" y="234" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="15">dozens of skills cost little</text>

  <line x1="378" y1="145" x2="420" y2="145" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="399" y="128" text-anchor="middle" fill="#475569" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">task</text>
  <text x="399" y="172" text-anchor="middle" fill="#475569" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">matches</text>

  <!-- Level 2 -->
  <rect x="425" y="20" width="350" height="250" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="600" y="58" text-anchor="middle" fill="#1e3a8a" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700">Level 2: Instructions</text>
  <text x="600" y="92" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="16">The body of SKILL.md:</text>
  <text x="600" y="114" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="16">steps, rules, and examples</text>
  <rect x="460" y="140" width="280" height="40" rx="8" fill="#dbeafe"/>
  <text x="600" y="166" text-anchor="middle" fill="#1e40af" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700">Loaded when relevant</text>
  <text x="600" y="212" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="15">Only the skill the task needs</text>
  <text x="600" y="234" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="15">enters the context window</text>

  <line x1="783" y1="145" x2="825" y2="145" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="804" y="128" text-anchor="middle" fill="#475569" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">step</text>
  <text x="804" y="172" text-anchor="middle" fill="#475569" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">needs it</text>

  <!-- Level 3 -->
  <rect x="830" y="20" width="350" height="250" rx="16" fill="#faf5ff" stroke="#7e22ce" stroke-width="3"/>
  <text x="1005" y="58" text-anchor="middle" fill="#581c87" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700">Level 3: Resources</text>
  <text x="1005" y="92" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="16">Reference files, templates,</text>
  <text x="1005" y="114" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="16">and scripts in the folder</text>
  <rect x="865" y="140" width="280" height="40" rx="8" fill="#f3e8ff"/>
  <text x="1005" y="166" text-anchor="middle" fill="#6b21a8" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700">Read or run on demand</text>
  <text x="1005" y="212" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="15">A script’s output enters context,</text>
  <text x="1005" y="234" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="15">not the script’s source code</text>

  <text x="600" y="312" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700">Pay for context only when the task needs it: the opposite of a monolithic system prompt</text>
</svg>
