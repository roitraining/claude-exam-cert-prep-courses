<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Layered Defense-in-Depth Guardrail Architecture">
  <defs>
    <marker id="arr-g1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e71d6"/>
    </marker>
  </defs>

  <rect width="1200" height="420" rx="18" fill="#f4f8fc" stroke="#dbe5f0" stroke-width="2"/>
  <text x="600" y="46" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="700">Defense-in-Depth Guardrail Layering Across the AI Request Lifecycle</text>

  <!-- Layer 1: Input Guardrails -->
  <rect x="30" y="85" width="255" height="225" rx="14" fill="#ffffff" stroke="#1e71d6" stroke-width="3"/>
  <rect x="30" y="85" width="255" height="46" rx="14" fill="#1e71d6"/>
  <text x="157" y="114" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700">1. Input Guardrails</text>
  <text x="157" y="162" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">Pre-Model Screening</text>
  <text x="157" y="192" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="14">" PII / PHI detection and masking</text>
  <text x="157" y="216" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="14">" Prompt injection classifier</text>
  <text x="157" y="240" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="14">" Scope / topic boundary check</text>
  <text x="157" y="264" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="14">" Rate and token quotas</text>

  <line x1="285" y1="197" x2="320" y2="197" stroke="#1e71d6" stroke-width="4" marker-end="url(#arr-g1)"/>

  <!-- Layer 2: Context Isolation -->
  <rect x="330" y="85" width="255" height="225" rx="14" fill="#ffffff" stroke="#6a55e4" stroke-width="3"/>
  <rect x="330" y="85" width="255" height="46" rx="14" fill="#6a55e4"/>
  <text x="457" y="114" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700">2. Context Isolation</text>
  <text x="457" y="162" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">Trust Boundary Separation</text>
  <text x="457" y="192" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="14">" XML tags for untrusted data</text>
  <text x="457" y="216" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="14">" ACL-filtered RAG retrieval</text>
  <text x="457" y="240" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="14">" Least-privilege tool sets</text>
  <text x="457" y="264" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="14">" Isolated subagent contexts</text>

  <line x1="585" y1="197" x2="620" y2="197" stroke="#1e71d6" stroke-width="4" marker-end="url(#arr-g1)"/>

  <!-- Layer 3: Action / Tool Hooks -->
  <rect x="630" y="85" width="255" height="225" rx="14" fill="#ffffff" stroke="#dc2626" stroke-width="3"/>
  <rect x="630" y="85" width="255" height="46" rx="14" fill="#dc2626"/>
  <text x="757" y="114" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700">3. Action / Tool Hooks</text>
  <text x="757" y="162" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">Deterministic Enforcement</text>
  <text x="757" y="192" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="14">" PreToolUse policy checks</text>
  <text x="757" y="216" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="14">" Prerequisite identity gates</text>
  <text x="757" y="240" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="14">" Financial cap enforcement</text>
  <text x="757" y="264" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="14">" HITL approval before write</text>

  <line x1="885" y1="197" x2="920" y2="197" stroke="#1e71d6" stroke-width="4" marker-end="url(#arr-g1)"/>

  <!-- Layer 4: Output Guardrails -->
  <rect x="930" y="85" width="240" height="225" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="3"/>
  <rect x="930" y="85" width="240" height="46" rx="14" fill="#16a34a"/>
  <text x="1050" y="114" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700">4. Output Guardrails</text>
  <text x="1050" y="162" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">Post-Generation Gate</text>
  <text x="1050" y="192" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="14">" Schema / Pydantic check</text>
  <text x="1050" y="216" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="14">" Citation grounding check</text>
  <text x="1050" y="240" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="14">" Data leakage / PII filter</text>
  <text x="1050" y="264" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="14">" Immutable audit log</text>

  <!-- Bottom note -->
  <rect x="30" y="335" width="1140" height="52" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="600" y="367" text-anchor="middle" fill="#991b1b" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700">Never rely on a single system-prompt instruction for safety: layer input, context, deterministic hook, and output controls.</text>
</svg>
