<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Layered Defense-in-Depth Guardrail Architecture">
  <defs>
    <marker id="arr-g1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e71d6"/>
    </marker>
  </defs>

  <!-- Layer 1: Input Guardrails -->
  <rect x="20" y="15" width="260" height="235" rx="14" fill="#ffffff" stroke="#1e71d6" stroke-width="3"/>
  <rect x="20" y="15" width="260" height="48" rx="14" fill="#1e71d6"/>
  <text x="150" y="45" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">1. Input Guardrails</text>
  <text x="150" y="92" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700">Pre-Model Screening</text>
  <text x="150" y="126" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="15">• PII / PHI masking</text>
  <text x="150" y="154" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="15">• Injection classifier</text>
  <text x="150" y="182" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="15">• Topic boundary check</text>
  <text x="150" y="210" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="15">• Rate and token quotas</text>

  <line x1="280" y1="132" x2="315" y2="132" stroke="#1e71d6" stroke-width="4" marker-end="url(#arr-g1)"/>

  <!-- Layer 2: Context Isolation -->
  <rect x="325" y="15" width="260" height="235" rx="14" fill="#ffffff" stroke="#6a55e4" stroke-width="3"/>
  <rect x="325" y="15" width="260" height="48" rx="14" fill="#6a55e4"/>
  <text x="455" y="45" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">2. Context Isolation</text>
  <text x="455" y="92" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700">Trust Boundaries</text>
  <text x="455" y="126" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="15">• XML untrusted tags</text>
  <text x="455" y="154" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="15">• ACL-filtered RAG</text>
  <text x="455" y="182" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="15">• Least-privilege tools</text>
  <text x="455" y="210" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="15">• Subagent isolation</text>

  <line x1="585" y1="132" x2="620" y2="132" stroke="#1e71d6" stroke-width="4" marker-end="url(#arr-g1)"/>

  <!-- Layer 3: Action / Tool Hooks -->
  <rect x="630" y="15" width="260" height="235" rx="14" fill="#ffffff" stroke="#dc2626" stroke-width="3"/>
  <rect x="630" y="15" width="260" height="48" rx="14" fill="#dc2626"/>
  <text x="760" y="45" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">3. Action / Tool Hooks</text>
  <text x="760" y="92" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700">Deterministic Gates</text>
  <text x="760" y="126" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="15">• PreToolUse policy check</text>
  <text x="760" y="154" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="15">• Identity prerequisite</text>
  <text x="760" y="182" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="15">• Financial cap gate</text>
  <text x="760" y="210" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="15">• HITL write approval</text>

  <line x1="890" y1="132" x2="925" y2="132" stroke="#1e71d6" stroke-width="4" marker-end="url(#arr-g1)"/>

  <!-- Layer 4: Output Guardrails -->
  <rect x="935" y="15" width="245" height="235" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="3"/>
  <rect x="935" y="15" width="245" height="48" rx="14" fill="#16a34a"/>
  <text x="1057" y="45" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">4. Output Guardrails</text>
  <text x="1057" y="92" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700">Post-Generation Gate</text>
  <text x="1057" y="126" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="15">• Schema / Pydantic check</text>
  <text x="1057" y="154" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="15">• Citation grounding check</text>
  <text x="1057" y="182" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="15">• PII / leakage filter</text>
  <text x="1057" y="210" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="15">• Immutable audit log</text>

  <!-- Bottom note -->
  <rect x="20" y="272" width="1160" height="52" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="600" y="304" text-anchor="middle" fill="#991b1b" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700">Never rely on a single system-prompt instruction for safety: layer input, context, deterministic hook, and output controls.</text>
</svg>
