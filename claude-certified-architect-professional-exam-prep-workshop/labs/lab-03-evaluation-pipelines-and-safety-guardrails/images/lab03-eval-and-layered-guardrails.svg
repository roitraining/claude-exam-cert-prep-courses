<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" width="1100" height="360" role="img" aria-label="Lab 3 Overview: Mixed Evaluation Suite, Layered Guardrails, and Compliance">
  <!-- Panel 1: Mixed Evals & RAG Diagnostics -->
  <rect x="20" y="25" width="335" height="310" rx="14" fill="#ffffff" stroke="#1e71d6" stroke-width="3"/>
  <rect x="20" y="25" width="335" height="48" rx="14" fill="#1e71d6"/>
  <text x="187" y="55" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">Task 1: Evals and Diagnostics</text>
  <rect x="42" y="92" width="290" height="96" rx="10" fill="#e0edff"/>
  <text x="187" y="118" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">Mixed-Methodology Evals</text>
  <text x="187" y="142" text-anchor="middle" fill="#1e3a8a" font-family="Inter, system-ui, sans-serif" font-size="13">1. Code Graders (CI every commit)</text>
  <text x="187" y="164" text-anchor="middle" fill="#1e3a8a" font-family="Inter, system-ui, sans-serif" font-size="13">2. Calibrated LLM-as-a-Judge</text>
  <rect x="42" y="204" width="290" height="106" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="187" y="232" text-anchor="middle" fill="#991b1b" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">Post-Refresh RAG Failure</text>
  <text x="187" y="256" text-anchor="middle" fill="#7f1d1d" font-family="Inter, system-ui, sans-serif" font-size="13">Confident wrong answers after update</text>
  <text x="187" y="278" text-anchor="middle" fill="#7f1d1d" font-family="Inter, system-ui, sans-serif" font-size="13">-&gt; Check Retrieval / Indexing first</text>

  <!-- Panel 2: Layered Defense-in-Depth Guardrails -->
  <rect x="382" y="25" width="335" height="310" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="3"/>
  <rect x="382" y="25" width="335" height="48" rx="14" fill="#16a34a"/>
  <text x="550" y="55" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">Task 2: 4-Layer Guardrails</text>
  <rect x="405" y="92" width="290" height="46" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="550" y="120" text-anchor="middle" fill="#065f46" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">Layer 1: Fast Input Screen (PII/Injection)</text>
  <rect x="405" y="148" width="290" height="46" rx="8" fill="#e0edff" stroke="#93c5fd"/>
  <text x="550" y="176" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">Layer 2: XML Trust Tag Isolation</text>
  <rect x="405" y="204" width="290" height="46" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="550" y="232" text-anchor="middle" fill="#991b1b" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">Layer 3: Deterministic PreToolUse Hook</text>
  <rect x="405" y="260" width="290" height="50" rx="8" fill="#f3e8ff" stroke="#d8b4fe"/>
  <text x="550" y="290" text-anchor="middle" fill="#581c87" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">Layer 4: Output Citation Verifier</text>

  <!-- Panel 3: HITL & Regulatory Compliance -->
  <rect x="745" y="25" width="335" height="310" rx="14" fill="#ffffff" stroke="#6a55e4" stroke-width="3"/>
  <rect x="745" y="25" width="335" height="48" rx="14" fill="#6a55e4"/>
  <text x="912" y="55" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">Task 3 and 4: HITL and Compliance</text>
  <rect x="768" y="92" width="290" height="96" rx="10" fill="#f3e8ff" stroke="#d8b4fe"/>
  <text x="912" y="118" text-anchor="middle" fill="#581c87" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">HITL Validation</text>
  <text x="912" y="142" text-anchor="middle" fill="#6b21a8" font-family="Inter, system-ui, sans-serif" font-size="13">Sync pre-action sign-off +</text>
  <text x="912" y="164" text-anchor="middle" fill="#6b21a8" font-family="Inter, system-ui, sans-serif" font-size="13">Async calibrated review queue</text>
  <rect x="768" y="204" width="290" height="106" rx="10" fill="#082445"/>
  <text x="912" y="232" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">GDPR | HIPAA | FedRAMP</text>
  <text x="912" y="256" text-anchor="middle" fill="#9eb6d4" font-family="Inter, system-ui, sans-serif" font-size="13">PII erasure, BAA + ZDR endpoints,</text>
  <text x="912" y="278" text-anchor="middle" fill="#9eb6d4" font-family="Inter, system-ui, sans-serif" font-size="13">and FedRAMP-authorized regions</text>
</svg>
