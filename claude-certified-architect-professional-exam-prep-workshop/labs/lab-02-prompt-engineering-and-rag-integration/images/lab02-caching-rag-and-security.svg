<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" width="1100" height="360" role="img" aria-label="Lab 2 Overview: Prompt Caching Prefix, Least Privilege Tools, and Hybrid RAG">
  <!-- Panel 1: Prompt Caching & XML Boundaries -->
  <rect x="20" y="25" width="335" height="310" rx="14" fill="#ffffff" stroke="#1e71d6" stroke-width="3"/>
  <rect x="20" y="25" width="335" height="48" rx="14" fill="#1e71d6"/>
  <text x="187" y="55" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">Task 1: Silent Cache Invalidators</text>
  <rect x="42" y="92" width="290" height="96" rx="10" fill="#e0edff"/>
  <text x="187" y="118" text-anchor="middle" fill="#082445" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">Two Requests, One Prefix</text>
  <text x="187" y="142" text-anchor="middle" fill="#1e3a8a" font-family="Inter, system-ui, sans-serif" font-size="13">Call 2 should read the cache</text>
  <text x="187" y="164" text-anchor="middle" fill="#1e3a8a" font-family="Inter, system-ui, sans-serif" font-size="13">Watch cache_read_input_tokens</text>
  <rect x="42" y="204" width="290" height="106" rx="10" fill="#f3e8ff" stroke="#d8b4fe"/>
  <text x="187" y="232" text-anchor="middle" fill="#581c87" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">Find All Three Bugs</text>
  <text x="187" y="256" text-anchor="middle" fill="#6b21a8" font-family="Inter, system-ui, sans-serif" font-size="13">Fix one at a time and re-run</text>
  <text x="187" y="278" text-anchor="middle" fill="#6b21a8" font-family="Inter, system-ui, sans-serif" font-size="13">Reads stay at 0 until all are fixed</text>

  <!-- Panel 2: Least-Privilege Capability Removal -->
  <rect x="382" y="25" width="335" height="310" rx="14" fill="#ffffff" stroke="#dc2626" stroke-width="3"/>
  <rect x="382" y="25" width="335" height="48" rx="14" fill="#dc2626"/>
  <text x="550" y="55" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">Task 2: Retrieval and Data Shape</text>
  <rect x="405" y="92" width="290" height="96" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="550" y="118" text-anchor="middle" fill="#991b1b" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">Four Test Queries</text>
  <text x="550" y="142" text-anchor="middle" fill="#7f1d1d" font-family="Inter, system-ui, sans-serif" font-size="13">Exact codes, a stale policy,</text>
  <text x="550" y="164" text-anchor="middle" fill="#7f1d1d" font-family="Inter, system-ui, sans-serif" font-size="13">and another tenant’s runbook</text>
  <rect x="405" y="204" width="290" height="106" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  <text x="550" y="232" text-anchor="middle" fill="#065f46" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">Filter Before Ranking</text>
  <text x="550" y="256" text-anchor="middle" fill="#047857" font-family="Inter, system-ui, sans-serif" font-size="13">Tenant and status metadata</text>
  <text x="550" y="278" text-anchor="middle" fill="#047857" font-family="Inter, system-ui, sans-serif" font-size="13">Then cite what was used</text>

  <!-- Panel 3: Hybrid RAG & Connection Protocols -->
  <rect x="745" y="25" width="335" height="310" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="3"/>
  <rect x="745" y="25" width="335" height="48" rx="14" fill="#16a34a"/>
  <text x="912" y="55" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">Task 3 and 4: Decisions and Tiers</text>
  <rect x="768" y="92" width="290" height="96" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  <text x="912" y="118" text-anchor="middle" fill="#065f46" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">Integration Coaching</text>
  <text x="912" y="142" text-anchor="middle" fill="#047857" font-family="Inter, system-ui, sans-serif" font-size="13">Protocols and context strategy</text>
  <text x="912" y="164" text-anchor="middle" fill="#047857" font-family="Inter, system-ui, sans-serif" font-size="13">plus a bloated agent config</text>
  <rect x="768" y="204" width="290" height="106" rx="10" fill="#082445"/>
  <text x="912" y="232" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">Measure a Tier Decision</text>
  <text x="912" y="256" text-anchor="middle" fill="#9eb6d4" font-family="Inter, system-ui, sans-serif" font-size="13">Same tickets on two models</text>
  <text x="912" y="278" text-anchor="middle" fill="#9eb6d4" font-family="Inter, system-ui, sans-serif" font-size="13">Accuracy, latency, and cost</text>
</svg>
